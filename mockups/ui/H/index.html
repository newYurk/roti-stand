<style>

body{display:flex;align-items:center;justify-content:center;font-family:Pangolin,Neucha,sans-serif}
#phone{position:relative;width:390px;height:844px;border-radius:54px;overflow:hidden;background:#e8cf9f;
  box-shadow:0 0 0 11px #141110,0 0 0 13px #4a3f38,0 30px 80px rgba(0,0,0,.6)}
@media (max-width:500px){#phone{width:100vw;height:100vh;border-radius:0;box-shadow:none}}
svg.scr{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
#fade{pointer-events:none;transition:opacity 1.6s ease-in-out}
.hit{cursor:pointer}
#rev{position:absolute;left:10px;right:10px;top:46px;z-index:5;background:rgba(32,24,20,.8);color:#f6ead2;
  border-radius:14px;padding:6px 9px 7px;font:13px/1.25 Neucha,sans-serif;backdrop-filter:blur(2px)}
#rev .row{display:flex;align-items:center;gap:6px}
#rev button{all:unset;cursor:pointer;width:30px;height:26px;border-radius:8px;background:rgba(255,255,255,.12);text-align:center;font:15px/26px sans-serif}
#rev select{flex:1;min-width:0;background:rgba(255,255,255,.12);color:#f6ead2;border:0;border-radius:8px;height:26px;font:13px Neucha,sans-serif}
#rev select option,#rev select optgroup{color:#222}
#rev input{flex:1;accent-color:#f2b632}
#cap{margin-top:4px;min-height:30px}
#rev .lbl{min-width:84px;font-size:12px;opacity:.85}
#rev.min #cap,#rev.min .r2{display:none}
body.clean #rev{display:none}
/* motion: pop = new thing arrives, settle = it lands; durations in STYLE.md */
@keyframes pop{0%{transform:scale(.6) rotate(-6deg);opacity:0}60%{transform:scale(1.06) rotate(1deg);opacity:1}100%{transform:scale(1) rotate(0)}}
.pop{animation:pop .32s cubic-bezier(.3,1.4,.5,1) both;transform-box:fill-box;transform-origin:50% 60%}
@keyframes settle{0%{transform:translateY(-14px)}70%{transform:translateY(2px)}100%{transform:translateY(0)}}
.settle{animation:settle .42s cubic-bezier(.2,.8,.3,1) both}
@keyframes drift{0%{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(var(--r));opacity:0}25%{opacity:1}100%{transform:translate(0,0) scale(1) rotate(0deg);opacity:1}}
.heart{animation:drift 3.4s cubic-bezier(.2,.7,.3,1) both}
@keyframes shimmer{0%,100%{opacity:.25}50%{opacity:.7}}
.steam{animation:shimmer 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.95}}
.ring{animation:breathe 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.pop,.settle,.heart,.steam,.bob,.ring{animation:none}}
</style>

<div id="phone">

</div>
<script>
'use strict';window.onerror=(m,u,l)=>{window.__err=m+' @'+l};
const T0=performance.now();
const W=390,H=844, NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('g');
const q=new URLSearchParams(location.search);
if(q.has('clean'))document.body.classList.add('clean');
const now=new Date();

/* ---------- crayon geometry ---------- */
function R(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd=R(1);const seed=s=>rnd=R(s);const J=a=>(rnd()*2-1)*a;
const f=p=>p[0].toFixed(1)+','+p[1].toFixed(1);
function curve(pts,closed=true){const n=pts.length,P=i=>pts[closed?(i+n)%n:Math.max(0,Math.min(n-1,i))];
  let d='M'+f(pts[0]);const last=closed?n:n-1;
  for(let i=0;i<last;i++){const a=P(i-1),b=P(i),c=P(i+1),e=P(i+2);
    d+='C'+f([b[0]+(c[0]-a[0])/6,b[1]+(c[1]-a[1])/6])+' '+f([c[0]-(e[0]-b[0])/6,c[1]-(e[1]-b[1])/6])+' '+f(c);}
  return d+(closed?'Z':'');}
// wobbly polygon: corners kept, edges subdivided and jittered
function wp(pts,a=1.6,step=26){const out=[];const n=pts.length;
  for(let i=0;i<n;i++){const p=pts[i],q2=pts[(i+1)%n];const L=Math.hypot(q2[0]-p[0],q2[1]-p[1]);const k=Math.max(1,Math.round(L/step));
    for(let j=0;j<k;j++){const t=j/k;out.push([p[0]+(q2[0]-p[0])*t+J(j?a:a*.5),p[1]+(q2[1]-p[1])*t+J(j?a:a*.5)]);}}
  return curve(out);}
function wb(cx,cy,rx,ry,a=1.5,n=0,rot=0){n=n||Math.max(9,Math.round((rx+ry)/7));const c=Math.cos(rot),s=Math.sin(rot),pts=[];
  for(let i=0;i<n;i++){const t=i/n*Math.PI*2+J(.08);const k=1+J(a/Math.max(rx,ry));const x=Math.cos(t)*rx*k,y=Math.sin(t)*ry*k;pts.push([cx+x*c-y*s,cy+x*s+y*c]);}
  return curve(pts);}
function wl(pts,a=1.2,step=18){const out=[];for(let i=0;i<pts.length-1;i++){const p=pts[i],q2=pts[i+1];const k=Math.max(1,Math.round(Math.hypot(q2[0]-p[0],q2[1]-p[1])/step));
  for(let j=0;j<k;j++){const t=j/k;out.push([p[0]+(q2[0]-p[0])*t+J(a),p[1]+(q2[1]-p[1])*t+J(a)]);}}out.push(pts[pts.length-1]);return curve(out,false);}
const P=(pts,fill,a,ex='')=>`<path d="${wp(pts,a)}" fill="${fill}" ${ex}/>`;
const B=(cx,cy,rx,ry,fill,a,ex='',rot=0)=>`<path d="${wb(cx,cy,rx,ry,a,0,rot)}" fill="${fill}" ${ex}/>`;
// crayon stroke: two passes, uneven pressure
const L=(pts,col,w=2.2,a=1,ex='')=>`<path d="${wl(pts,a)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${ex}/>`+
  `<path d="${wl(pts.map(p=>[p[0]+J(.8),p[1]+J(.8)]),a)}" fill="none" stroke="${col}" stroke-width="${(w*.6).toFixed(1)}" stroke-linecap="round" opacity=".7" ${ex}/>`;
const OB=(cx,cy,rx,ry,col,w=2,a=1.2)=>`<path d="${wb(cx,cy,rx,ry,a)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`;
let clipN=0;
// scribble hatch inside a shape (shade the crayon way)
function hatch(d,x,y,w,h,col,gap=5,ang=-0.5,sw=1.6,op=.75){const id='c'+(clipN++);let s=`<clipPath id="${id}"><path d="${d}"/></clipPath><g clip-path="url(#${id})" opacity="${op}">`;
  const pts=[];const cx=x+w/2,cy=y+h/2,D=Math.hypot(w,h)/2+6,ca=Math.cos(ang),sa=Math.sin(ang);
  for(let t=-D,i=0;t<D;t+=gap,i++){const u=(i%2?D:-D);const px=cx+ca*u-sa*t+J(1.5),py=cy+sa*u+ca*t+J(1.5);pts.push([px,py]);}
  s+=`<path d="${curve(pts,false)}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linejoin="round"/></g>`;return s;}
const T=(x,y,txt,sz,col,fam='Neucha',ex='')=>`<text x="${x}" y="${y}" font-family="${fam}" font-size="${sz}" fill="${col}" ${ex}>${txt}</text>`;
const G=(inner,ex='')=>`<g ${ex}>${inner}</g>`;

// No live SVG filters: edge noise is in the geometry (wp/wb/wl), the crayon "tooth" and the paper are
// baked once per phase into small canvas tiles (see bake()) and laid over / under the drawing as patterns.
const WAX=s=>s, FOOD=s=>s;
// misregistration: the colour pass is printed a hair off the outline, like a second crayon pass
const MR=(d,col,dx=1.6,dy=1.1,w=1.5,op=.55)=>`<path d="${d}" transform="translate(${dx} ${dy})" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round" opacity="${op}"/>`;

/* ---------- time of day: the phone's real hour picks the phase and the place ---------- */
function phase(h){h=((h%24)+24)%24;return h<5?'deep':h<11?'morning':h<16?'day':h<19.5?'evening':'night';}
const PH={
 morning:{name:'утро',where:'у школы',paper:'#e8cf9f',sky1:'#9fcfdc',sky2:'#f7e6b0',wall:'#f1c24f',wall2:'#e5a93a',acc:'#d9553b',grn:'#4f8d55',shd:'#8783b6',tint:'#fff4e0',tintOp:0,glow:0,st:'#b7c4c4',ref:'#d4e8ea',ink:'#3a2a24',chalk:'#fff6dc',fib:-1},
 day:{name:'день',where:'у причала',paper:'#edd6a8',sky1:'#cfe8e6',sky2:'#fbf3d9',wall:'#c98a52',wall2:'#9b5f36',acc:'#ee7a24',grn:'#5f9a46',shd:'#6f8fb3',water:'#4c9aa1',tint:'#fff',tintOp:0,glow:0,st:'#c3cbc8',ref:'#f4f6ee',ink:'#3a2a24',chalk:'#fff6dc',fib:-1},
 evening:{name:'вечер',where:'у канала',paper:'#9a6f55',sky1:'#7b5a8c',sky2:'#f2a35c',wall:'#5c3e5e',wall2:'#43304d',acc:'#d63a2c',grn:'#2f5e50',shd:'#563a6a',water:'#356b74',tint:'#ffc9a3',tintOp:.28,glow:.35,st:'#b4a6a6',ref:'#f2b06e',ink:'#fbe8c8',chalk:'#ffe9c4',fib:1},
 night:{name:'ночь',where:'ночной рынок',paper:'#26213a',sky1:'#1b1d42',sky2:'#353467',wall:'#c9433a',wall2:'#3e8f74',acc:'#ffd25e',grn:'#2d5c4c',shd:'#1a1a3c',tint:'#5f62a3',tintOp:.5,glow:.7,st:'#8f8fa6',ref:'#ffd25e',ink:'#f3e6c8',chalk:'#fff1c8',fib:1},
 deep:{name:'глубокая ночь',where:'тележка спит',paper:'#181626',sky1:'#0d0e24',sky2:'#1f1e3d',wall:'#3a3350',wall2:'#2b3a45',acc:'#e9dfb0',grn:'#1d3a34',shd:'#0b0b1e',tint:'#3b3f7a',tintOp:.42,glow:0,st:'#6f7084',ref:'#b9b7d8',ink:'#dcd6f0',chalk:'#e9e4ff',fib:1}
};
const PHS=['morning','day','evening','night','deep'];
// constant materials
const M={ink:'#3a2a24',skin1:'#b47650',skin2:'#a1623f',skinD:'#7d4527',hair:'#221916',steel:'#b8c2c1',steel2:'#8e9b9b',steelHi:'#e4ebe8',teak:'#9b5a2c',teak2:'#6f3d1d',
  dough:'#f3e2bd',dough2:'#e6c993',gold:'#e9a53c',brown:'#b8621c',dark:'#7e3c10',banana:'#f4dc78',milk:'#fbf4e2',milkEdge:'#8a5326',awn1:'#3f9a93',awn2:'#f3e6c8',tin:'#c8352b',tin2:'#e9c25a',
  som:'#7b4d8f',som2:'#5b3570',somNote:'#7b4d8f',kraft:'#d7b27a',kraft2:'#c49a5e',heart:'#e0453a',heart2:'#f08aa0'};

/* ---------- backdrops by place ---------- */
function sky(p){let s=`<rect x="-10" y="-10" width="410" height="480" fill="${p.sky2}"/>`;
  s+=P([[-10,-10],[400,-10],[400,120+J(6)],[-10,150]],p.sky1,4);
  for(let i=0;i<9;i++){const y=118+i*9+J(3);s+=L([[-10,y+J(4)],[130+J(60),y+J(3)],[260+J(60),y+J(3)],[400,y-6+J(4)]],p.sky1,7-i*.6,2,`opacity="${(.85-i*.09).toFixed(2)}"`);}
  return s;}
function school(p){seed(11);let s=sky(p);
  // sun low left
  s+=B(70,170,30,30,'#fff1c2',2)+B(70,170,22,22,'#ffe28a',1.5);
  // frangipani tree
  s+=P([[318,440],[330,300],[336,300],[338,440]],M.teak2,2)+B(300,280,60,40,p.grn,4)+B(355,300,40,34,p.grn,3)+B(330,255,34,26,'#6aa25e',3);
  [[296,262],[318,286],[352,276],[284,300],[340,312]].forEach(([x,y])=>{for(let k=0;k<5;k++){const a=k/5*6.28;s+=B(x+Math.cos(a)*4,y+Math.sin(a)*4,3.6,2.4,'#fff7e8',.5,'',a);}s+=B(x,y,2,2,'#f5c330',.3);});
  // school building
  s+=P([[-10,250],[250,236],[262,440],[-10,440]],p.wall,2.5)+P([[-20,252],[120,196],[268,238]],p.acc,3);
  s+=hatch(wp([[-10,250],[250,236],[262,440],[-10,440]],0),-10,236,272,204,p.wall2,7,0.9,2,.55);
  for(let i=0;i<4;i++)for(let r=0;r<2;r++)s+=P([[10+i*58,276+r*72],[50+i*58,274+r*72],[51+i*58,320+r*72],[11+i*58,322+r*72]],'#5e7fa3',1.5)+L([[30+i*58,276+r*72],[31+i*58,320+r*72]],'#f7ecd2',1.6,.5);
  // flagpole + Thai flag
  s+=L([[132,440],[130,120]],'#6d6d6d',3,.6);const fl=[['#c8312c',0],['#f6efe1',6],['#2b3d7a',12],['#f6efe1',24],['#c8312c',30]];
  fl.forEach(([c,o],i)=>s+=P([[131,126+o],[176,128+o+J(1)],[176,128+o+(i==2?12:6)],[131,126+o+(i==2?12:6)]],c,.8));
  // gate posts
  s+=P([[262,330],[284,330],[284,440],[262,440]],'#e9e1cf',1.5)+P([[258,322],[288,322],[288,332],[258,332]],p.acc,1);
  // ground
  s+=P([[-10,420],[400,410],[400,470],[-10,470]],'#cfa977',2);
  s+=hatch(wp([[-10,420],[400,410],[400,470],[-10,470]],0),-10,410,410,60,p.shd,6,-.2,1.5,.5);
  return s;}
function canal(p,eve){seed(eve?21:31);let s=sky(p);
  if(eve){s+=B(300,250,34,34,'#ffcf7a',2)+B(300,250,25,25,'#ffe7a8',1.5);}
  else s+=B(320,90,26,26,'#fffbea',1.5);
  // far houses on stilts
  const hs=[[-10,90,232],[78,70,212],[146,96,240],[244,80,220],[322,90,236]];
  hs.forEach(([x,w,top],i)=>{s+=P([[x,top+20],[x+w/2,top],[x+w,top+20],[x+w,330],[x,330]],i%2?p.wall:p.wall2,2.2);
    s+=P([[x-6,top+22],[x+w/2,top-4],[x+w+6,top+22],[x+w+2,top+28],[x+w/2,top+4],[x-2,top+28]],eve?'#2c2238':'#7b3f26',1.5);
    s+=P([[x+w*.3,top+40],[x+w*.55,top+40],[x+w*.55,top+70],[x+w*.3,top+70]],eve?'#ffcf6e':'#3a2d2a',1.2);
    for(let k=0;k<3;k++)s+=L([[x+8+k*(w-16)/2,330],[x+8+k*(w-16)/2,352]],eve?'#2c2238':M.teak2,2.4,.6);});
  // water
  s+=P([[-10,340],[400,336],[400,470],[-10,470]],p.water,2);
  for(let i=0;i<14;i++){const y=350+i*9,x=J(140)+180;s+=L([[x-30-J(20),y],[x-10,y+2],[x+10,y-1],[x+30+J(20),y+1]],eve?(i%3?'#f2a35c':'#ffd889'):'#e9f4f0',1.6,.8,'opacity=".75"');}
  if(eve){// lanterns string
    s+=L([[-10,180],[120,214],[260,200],[400,222]],'#2c2238',1.2,1);[[40,198],[100,210],[170,212],[230,204],[300,206],[360,216]].forEach(([x,y])=>s+=B(x,y+10,7,9,p.acc,1)+B(x,y+8,3,3,'#ffd889',.5));}
  else {// longtail boat
    s+=P([[90,400],[240,396],[262,384],[250,408],[100,414]],'#7b3f26',1.5)+P([[150,394],[190,393],[192,380],[152,382]],'#2f7fb0',1);}
  s+=P([[-10,440],[400,436],[400,470],[-10,470]],'#8a6a4c',1.5);
  return s;}
function market(p){seed(41);let s=sky(p);
  for(let i=0;i<20;i++)s+=B(J(195)+195,J(70)+90,1.2,1.2,'#f6ecd0',.2);
  // stalls tarps
  [[-20,150,p.wall],[120,140,p.wall2],[250,170,'#d98a2f']].forEach(([x,w,c],i)=>{const t=250+i*8;
    s+=P([[x,t],[x+w,t-6],[x+w+10,t+30],[x-8,t+34]],c,2);for(let k=0;k<5;k++)s+=P([[x+k*w/5,t-k*1.2],[x+(k+.5)*w/5,t-1-k],[x+(k+.5)*w/5+2,t+32-k],[x+k*w/5+2,t+33-k]],'#f3e6c8',1,'opacity=".8"');
    s+=P([[x+4,t+34],[x+w,t+30],[x+w,440],[x+4,440]],'#2a2647',1.5);
    s+=B(x+w*.5,t+80,w*.36,24,'#ffcf6e',3,'opacity=".55"');});
  // crowd silhouettes
  for(let i=0;i<9;i++){const x=i*48+J(10),y=372+J(10);s+=B(x,y,10,12,'#14142e',1.5)+P([[x-16,y+12],[x+16,y+12],[x+20,y+80],[x-20,y+80]],'#14142e',2);}
  // string bulbs
  s+=L([[-10,206],[195,236],[400,200]],'#0e0e22',1.3,1);for(let i=0;i<11;i++){const x=i*38+8,y=206+Math.sin(i/10*3.14)*28;s+=B(x,y+6,9,9,'#ffd25e',1,'opacity=".35"')+B(x,y+6,4,5,'#fff1b0',.6);}
  s+=P([[-10,440],[400,436],[400,470],[-10,470]],'#3a3352',1.5);
  return s;}


/* ---------- people: faces that act (no words), hands that show ---------- */
// mood: calm | joy | warm | wow | invite | sad | sleep ; o.look=[dx,dy] (-1..1) gaze ; o.age adds laugh lines
function face(x,y,s,mood='calm',o={}){let r='';const e=s*.3,ey=y-s*.05,lk=o.look||[0,0],lx=lk[0]*s*.07,ly=lk[1]*s*.05,ink=M.ink,my=y+s*.3;
  const up=mood=='wow'?-s*.15:mood=='invite'?-s*.09:mood=='sleep'?s*.02:-s*.03;
  [-1,1].forEach(k=>{const bx=x+k*e,by=ey-s*.27+up+(mood=='invite'&&k>0?-s*.06:0),sad=mood=='sad'?3:0,warm=(mood=='warm'||mood=='joy')?-1:0;
    r+=L([[bx-k*5,by+1-sad],[bx,by-1.6+warm],[bx+k*5.5,by+1.6+sad*.4]],o.brow||'#4a3a32',1.7,.25);});
  [-1,1].forEach(k=>{const ex=x+k*e;
    if(mood=='joy'||mood=='warm')r+=L([[ex-4.2,ey+1.6],[ex,ey-2.6],[ex+4.2,ey+1.6]],ink,2.1,.2);
    else if(mood=='sleep')r+=L([[ex-4,ey],[ex,ey+2],[ex+4,ey]],ink,1.8,.2);
    else{const big=mood=='wow'?1.25:1;r+=B(ex+lx,ey+ly,2.1*big,2.7*big,ink,.15)+B(ex+lx+.8,ey+ly-.9,.7,.7,'#fff',.05);}
    if(o.age){r+=L([[ex+k*6.5,ey-1.5],[ex+k*9.5,ey-3.5]],M.skinD,1.1,.2,'opacity=".7"')+L([[ex+k*6.5,ey+1.5],[ex+k*9.5,ey+2.8]],M.skinD,1.1,.2,'opacity=".7"');}});
  const bl=(mood=='joy'||mood=='warm')?.7:.5;
  r+=B(x-e-4,y+s*.2,4.4,2.6,'#e2735f',.5,`opacity="${bl}"`)+B(x+e+4,y+s*.2,4.4,2.6,'#e2735f',.5,`opacity="${bl}"`);
  if(mood=='joy')r+=P([[x-7.5,my-2.2],[x+7.5,my-2.2],[x+4.5,my+5.5],[x-4.5,my+5.5]],'#6e2620',.5)+B(x,my+3.6,3.2,1.6,'#e8907e',.3);

def('S01','Запуск','Крафт-бумага этого часа, на ней мелком — тележка и «โรตี». Окошко показывает место, которое сейчас по часам. Тап где угодно — дальше (первый запуск — выбор героя, потом сразу тележка).',(p,ph)=>{

  o+=`<clipPath id="${cid}"><path d="${wb(195,330,170,176,4)}"/></clipPath><g clip-path="url(#${cid})"><g transform="translate(0,60)">${place(p,ph)}</g>${light(p,ph,1)}</g>`;

  [['sister',104,-.05],['brother',286,.05]].forEach(([w,cx,r])=>{const sel=S.hero==w;
    o+=`<g transform="rotate(${r*57} ${cx} 560)">`+P([[cx-88,410],[cx+88,406],[cx+90,712],[cx-86,716]],'#1a120c',2,'opacity=".3" transform="translate(5 7)"')+kraft(cx-88,406,176,306,0,'#dcb985');

def('S04','Тележка на месте','Место и свет — по часам телефона (ползунок: утро школа, день причал, вечер канал, ночь рынок, 0–5 ч тележка спит). Шарики на подносе и есть запас теста. Кран газа справа внизу — тава греется, приходит гость. Жестянка слева внизу — меню.',(p,ph)=>{

def('C1','Шарик → диск','Камера съезжает на сталь, гость и Сом смотрят сверху. Шарик с подноса — прижать пальцем, он плющится в масляный диск. Сом показывает ладонью: жми.',(p,ph)=>{
  seed(1301);let o=peek(p,ph,{somMood:'warm'})+doughTray(-40,262,130,70,S.balls-1);
  o+=B(200,566,120,66,'#e9efe9',8,'opacity=".35"')+L([[110,606],[200,622],[300,600]],'#f4f6ee',4,3,'opacity=".5"');
  o+=B(204,560,92,84,'#d9c79a',2,'opacity=".45"')+B(195,552,88,80,M.dough,2.2)+OB(195,552,88,80,M.dough2,4,2)+B(170,526,30,14,'#fffaf0',3,'opacity=".7"',-.4);
  for(let i=0;i<3;i++)o+=OB(195,552,30+i*16,28+i*14,'#e6c993',1.4,1.6);
  o+=OB(195,552,126,116,'#7f8c8c',2,2).replace('fill="none"','fill="none" stroke-dasharray="6 9"');
  o+=hand(66,420,.3,'flat',M.skin2,1.2,1)+L([[56,452],[76,452]],'#fff6dc',2.4,.4)+L([[60,462],[72,462]],'#fff6dc',2,.4);
  return o+ring(195,552,30)+light(p,ph)+hit(90,440,210,230,'go:C2','прижать');});

def('C2','Растянуть','Тяни края к квадрату (пунктир на стали), быстрый мах — шлепок. Середина светлеет, как окошко; толстый ободок остаётся. Три касания — квадрат.',(p,ph)=>{
  let o=peek(p,ph,{somMood:'invite'})+doughTray(-40,262,130,70,S.balls-1);const k=Math.min(1,S.k/3),s=170+k*90;
  o+=L([[60,420],[330,420],[330,690],[60,690],[60,420]],'#7f8c8c',2.4,1.5,'stroke-dasharray="10 12"');
  o+=rotiSheet(195,555,s,k)+ring(195+s*.55,555+s*.52,26)+arrow([[195+s*.38,555+s*.36],[195+s*.5,555+s*.48]],'#fff6dc');
  o+=hand(40,440,-.25,'open',M.skin2,1.1,1)+arrow([[70,470],[100,444],[100,420]],'#d9a2e6');
  return o+light(p,ph)+hit(30,380,330,360,'stretch','тянуть тесто');});

def('C3','На таву','Касаешься середины листа и ведёшь — лист в руке, края провисают. Отпустила над тавой — ложится с ближнего края; мимо — вернётся на стол.',(p,ph)=>{
  seed(1501);let o=`<g transform="translate(0,-330)">${wide(p,ph,{guest:1,som:1,mood:'wow',somMood:'warm'})}</g>`+steel(148,844,p);
  o+=tava(195,330,170,150,1);
  o+=B(206,660,120,58,'#5a6060',8,'opacity=".28"');// the shadow on the steel
  const d=wp([[96,560],[300,548],[312,676],[86,690]],5,20);o+=`<path d="${d}" fill="${M.dough}"/><path d="${d}" fill="none" stroke="#f8ecd0" stroke-width="12"/><path d="${d}" fill="none" stroke="${M.dough2}" stroke-width="4"/>`;
  o+=`<path d="${wl([[96,600],[78,640],[86,690]],2)}" stroke="${M.dough2}" stroke-width="10" fill="none" stroke-linecap="round"/><path d="${wl([[300,570],[318,630],[312,676]],2)}" stroke="${M.dough2}" stroke-width="10" fill="none" stroke-linecap="round"/>`;
  o+=B(200,620,46,30,'#dfe0d4',5,'opacity=".35"')+hand(196,624,-1.5,'flat',M.skin1,1.25);
  o+=arrow([[196,560],[180,500],[190,440]],'#fff6dc');
  return o+light(p,ph)+hit(30,180,330,540,'go:C4','лист на таву');});

def('C4','Начинка','Лист лёг на таву квадратом, углы свисают за край. Миски — у большого пальца: тап по банану — ломтики, по яйцу — разбить в середину.',(p,ph)=>{
  seed(1601);let o=`<g transform="translate(0,-330)">${wide(p,ph,{guest:1,som:1,mood:'calm',somMood:'invite'})}</g>`+steel(148,844,p);
  let inside='';const d=wp([[60,318],[330,312],[338,580],[54,590]],3,22);inside+=`<path d="${d}" fill="${M.dough}"/><path d="${d}" fill="none" stroke="#efd9a8" stroke-width="12"/><path d="${d}" fill="none" stroke="#d9a75a" stroke-width="3"/>`;
  for(let i=0;i<9;i++){const x=150+(i%3)*44+J(6),y=400+Math.floor(i/3)*40+J(6);inside+=B(x,y,14,12,M.banana,1)+B(x,y,7,6,'#e9cd5f',1,'opacity=".7"')+[0,1,2].map(k=>B(x+Math.cos(k*2.1)*3.4,y+Math.sin(k*2.1)*3.4,.9,.9,'#6b5a20',.1)).join('');}
  inside+=B(196,470,58,42,'#fbf7ee',5,'opacity=".9"')+B(206,462,15,14,'#f5b326',1)+B(202,458,5,4,'#ffe59a',.4);
  o+=tava(195,452,168,146,1,inside);
  seed(1602);o+=P([[30,690],[150,686],[140,770],[40,774]],'#d9c79a',1.6)+B(90,700,58,14,'#8e9b9b',1.2);for(let i=0;i<6;i++)o+=B(56+i*14,704+J(4),9,7,M.banana,.6);
  o+=P([[250,694],[350,690],[342,770],[258,774]],'#e9e1cf',1.6)+B(300,704,48,12,'#c7c9c4',1)+B(286,700,11,14,'#f4e6cf',.6)+B(312,702,11,14,'#e8cfae',.6);
  return o+ring(90,734,30)+light(p,ph)+hit(24,680,130,100,'go:C5','миска с бананом')+hit(240,680,120,100,'go:C5','яйцо');});

def('C5','Конверт','Штрих от стороны к середине — складка. Две стороны уже сложены (прямоугольник); ещё две — квадратный конверт. Пунктир — где ляжет сгиб.',(p,ph)=>{
  seed(1701);let o=`<g transform="translate(0,-330)">${wide(p,ph,{guest:1,som:1,mood:'calm',somMood:'warm'})}</g>`+steel(148,844,p);
  let inside='';const d=wp([[118,320],[272,316],[278,590],[112,596]],2.5,20);
  inside+=`<path d="${d}" fill="#f2c56e"/>`+hatch(d,110,316,170,280,'#d79a48',8,.3,1.4,.4);
  inside+=P([[118,320],[200,318],[198,594],[112,596]],'#f4d58e',2)+MR(wp([[200,318],[198,594]],0),'#a8601f',0,0,2.4,.7);
  inside+=P([[200,318],[272,316],[278,590],[200,594]],'#efcb7c',2,'opacity=".85"')+L([[198,322],[200,590]],'#a8601f',2,1.2);
  inside+=L([[112,388],[278,384]],'#7f6a4a',2,1,'stroke-dasharray="7 7"')+L([[112,524],[278,520]],'#7f6a4a',2,1,'stroke-dasharray="7 7"');
  inside+=`<path d="${d}" fill="none" stroke="#c07a2a" stroke-width="5" opacity=".8"/>`;
  o+=tava(195,452,168,146,1,inside)+ring(195,620,28)+arrow([[195,616],[195,560],[195,530]],'#fff6dc');
  return o+light(p,ph)+hit(60,300,270,360,'go:C6','сложить сторону');});

def('C6','Жарить, перевернуть','Готовность видна по самому роти: край темнеет первым, пятна, приподнятый уголок показывает низ. Мах наружу — переворот; ещё касание — снять. Если час сменится посреди роти — доготовишь и подашь, сцена сменится мягко после.',(p,ph)=>{
  let o=`<g transform="translate(0,-210)">${wide(p,ph,{guest:1,som:1,mood:'wow',somMood:'warm'})}</g>`+steel(268,844,p)+doughTray(-40,262,130,70,S.balls-1);
  let inside=envelope(195,540,190,.07,S.flip?1:0);
  if(!S.flip){seed(401);inside+=`<path d="M300,598 C276,606 252,630 242,662 C262,652 288,640 302,636 Z" fill="#2c2624"/>`+`<path d="M300,598 C290,620 268,640 242,662 C270,664 296,650 304,622 Z" fill="${M.gold}"/>`+B(284,634,6,4,M.brown,1)+B(292,620,5,3,M.dark,1)+B(270,648,5,3,M.brown,1)+L([[244,660],[272,640],[300,600]],'#fbe0a6',2.4,.6);}
  o+=tava(195,540,176,168,1,inside);
  seed(402);for(let i=0;i<4;i++){const x=130+i*42;o+=`<g class="steam" style="animation-delay:${i*.6}s">${L([[x,430],[x-8,404],[x+4,380],[x-4,356]],'#fff6dc',2.6,1.5)}</g>`;}
  for(let i=0;i<16;i++){const a=rnd()*6.28,r=100+rnd()*20;o+=OB(195+Math.cos(a)*r*1.02,540+Math.sin(a)*r,2.5,2.5,'#f2e3b3',1,.3);}
  o+=P([[338,740],[392,712],[398,726],[346,756]],M.teak,1.4)+P([[300,760],[340,744],[346,756],[306,772]],'#c3cbca',1.2);
  if(!S.flip)o+=arrow([[130,700],[100,640],[118,560]],'#fff6dc')+ring(140,716,26);else o+=ring(195,540,40);
  return o+light(p,ph)+hit(20,360,350,370,'flip','тава');});

def('C7','Снять на стол','Тем же жестом «в руке»: роти с тавы — на крафт-бумагу на столе. Бумага — та самая, в которую потом завернут.',(p,ph)=>{
  seed(1801);let o=`<g transform="translate(0,-330)">${wide(p,ph,{guest:1,som:1,mood:'joy',somMood:'warm'})}</g>`+steel(148,844,p);
  o+=tava(195,250,150,96,1);
  o+=kraft(70,560,250,220,-.03)+OB(195,670,92,86,'#7a5a3a',2,2).replace('fill="none"','fill="none" stroke-dasharray="7 8"');
  o+=B(206,520,86,30,'#3a3a3a',6,'opacity=".22"');
  o+=`<g transform="rotate(-8 195 440)">${envelope(195,440,150,0,1)}</g>`+hand(200,452,-1.5,'flat',M.skin1,1.2);
  o+=arrow([[195,340],[195,372],[196,400]],'#fff6dc')+arrow([[196,520],[196,560],[196,600]],'#fff6dc');
  return o+light(p,ph)+hit(40,330,310,450,'go:C8','на стол');});

def('C8','Нарезать','Нарезка сеткой 3×3: ведёшь пальцем линию — нож идёт за ним. Одна линия уже прорезана, куски чуть разошлись; пунктир — следующие.',(p,ph)=>{
  seed(1901);let o=`<g transform="translate(0,-330)">${wide(p,ph,{guest:1,som:1,mood:'calm',somMood:'invite'})}</g>`+steel(148,844,p);
  o+=P([[30,250],[360,242],[366,700],[24,708]],'#c9925a',2.4)+hatch(wp([[30,250],[360,242],[366,700],[24,708]],0),24,242,342,466,'#9b6436',9,.05,1.6,.45);// chopping board
  o+=kraft(52,282,286,384,.02);
  o+=`<g transform="translate(-5 0)">`+`<clipPath id="cl8"><rect x="0" y="0" width="${195-58/1}" height="844"/></clipPath>`+'</g>';
  const cut=rotiCut(195,474,240,0);
  o+=`<clipPath id="cL"><rect x="0" y="0" width="153" height="844"/></clipPath><clipPath id="cR"><rect x="157" y="0" width="300" height="844"/></clipPath>`;
  o+=`<g clip-path="url(#cL)" transform="translate(-6 2)">${cut}</g><g clip-path="url(#cR)">${cut}</g>`;
  o+=L([[235,356],[235,592]],'#fff6dc',2.4,1,'stroke-dasharray="8 8"')+L([[78,394],[312,394]],'#fff6dc',2.4,1,'stroke-dasharray="8 8"')+L([[78,554],[312,554]],'#fff6dc',2.4,1,'stroke-dasharray="8 8"');
  o+=P([[236,300],[250,300],[250,350],[236,350]],'#c3cbca',1)+P([[234,250],[252,250],[252,302],[234,302]],M.teak2,1);// knife riding the finger
  return o+ring(235,620,26)+arrow([[235,612],[235,596],[235,580]],'#fff6dc')+light(p,ph)+hit(50,280,290,390,'go:C9','резать');});

def('C9','Полить сгущёнкой','Ведёшь пальцем — сгущёнка ложится зигзагом за ним, сверху сахар. У сгущёнки ириска-подкладка, у сахара тень: читаются и на ночной бумаге.',(p,ph)=>{
  seed(2001);let o=`<g transform="translate(0,-330)">${wide(p,ph,{guest:1,som:1,mood:'wow',somMood:'joy'})}</g>`+steel(148,844,p);
  o+=P([[30,250],[360,242],[366,700],[24,708]],'#c9925a',2.4)+hatch(wp([[30,250],[360,242],[366,700],[24,708]],0),24,242,342,466,'#9b6436',9,.05,1.6,.45)+kraft(52,282,286,384,.02)+rotiCut(195,474,240,0);
  o+=milkZig([[86,372],[130,420],[160,368],[200,430],[234,372],[262,428]],6)+sugar(160,420,80,50);
  o+=milkCan(300,330,-58)+`<path d="${wl([[276,348],[270,390],[264,426]],.6)}" stroke="${M.milk}" stroke-width="3" fill="none"/>`;
  o+=ring(264,430,24)+arrow([[272,452],[300,500],[310,540]],'#fff6dc').replace(/#fff6dc/g,'#fff6dc');
  return o+light(p,ph)+hit(40,260,320,420,'go:S10','полить');});

def('S10','Подать','Роти на крафт-бумаге в центре стойки; смахнуть вверх — к гостю. Гость тянется, Сом подталкивает взглядом.',(p,ph)=>{
  let o=wide(p,ph,{guest:1,som:1,mood:'wow',somMood:'invite',somO:{look:[1,.4]}})+light(p,ph)+bulb(p,ph)+counter(p,{heat:1,balls:S.balls-1});
  o+=kraft(80,488,220,200,-.04)+rotiCut(190,588,150,1)+arrow([[190,700],[190,640],[192,560],[196,470]],'#fff6dc')+ring(190,720,28);
  return o+hit(70,480,240,280,'go:S11','смахнуть к гостю');});

def('S11','Ответ гостя','Гость сияет и оставляет что-то своё (не деньги): школьник — рисунок, мототаксист — манго, рыбак — сушёная рыба, медсестра — гирлянда жасмина. Тап по подарку — принять.',(p,ph)=>{
  let o=wide(p,ph,{guest:1,som:1,mood:'joy',somMood:'joy',somGest:'cheer'})+light(p,ph)+bulb(p,ph)+counter(p,{heat:1,balls:S.balls-1});
  o+=`<g class="pop">${gift(ph,196,520)}</g>`+ring(196,524,46);
  return o+hit(130,470,140,110,'go:S12','принять подарок');});

def('S12','Показать миру','Свёрток из крафт-бумаги с рисунком роти — это и есть открытка. Бумажный журавлик — отпустить в мир; жестянка — оставить себе. Ничего не обязательно.',(p,ph)=>{
  let o=wide(p,ph,{guest:1,som:1,mood:'joy',somMood:'warm'})+light(p,ph)+counter(p,{heat:1,balls:S.balls-1})+dim(.6);
  o+=`<g class="settle">${card(p,ph,195,380,-2,.9)}</g>`;seed(2201);
  o+=P([[28,700],[186,696],[190,808],[24,812]],M.awn1,2)+MR(wp([[28,700],[186,696],[190,808],[24,812]],0),'#1f4f4b');
  o+=P([[70,770],[150,720],[118,782]],'#fbf7ee',1)+P([[70,770],[118,782],[100,790]],'#d9d2c0',.8)+P([[118,782],[150,720],[126,768]],'#ece6d6',.8)+L([[40,792],[60,780],[78,786]],'#fbf7ee',1.6,.6,'stroke-dasharray="4 5"');
  o+=P([[206,700],[364,696],[368,808],[202,812]],'#5a1712',2,'opacity=".7"')+tinBox(222,712,128,84);
  return o+hit(20,690,174,126,'go:S13','отпустить в мир')+hit(198,690,174,126,'go:S13','оставить себе');});

def('S13','Карточка роти','Карточка-след: окошко места в этот час, гость, само роти, дата и время рукой. Тап — убрать в жестянку; дальше следующий гость, пока есть шарики (на макете — последний шарик, к S15).',(p,ph)=>{
  let o=paperLayer(p)+`<g transform="translate(0,-60)">${wide(p,ph,{})}</g>`+light(p,ph)+dim(.45);
  o+=`<g class="pop">${card(p,ph,195,440,1.5,1.12)}</g>`;
  return o+ring(195,800,24)+hit(0,0,390,844,'go:S15','закрыть');});

def('S14','Сердечки позже','Позже, когда люди посмотрели: сердечки тихо прилетают и прилипают к открытке на прищепке у навеса. Без счёта, ни на что не влияют.',(p,ph)=>{
  let o=wide(p,ph,{})+light(p,ph)+bulb(p,ph)+counter(p,{heat:0,balls:S.balls});
  o+=L([[-10,96],[195,120],[400,92]],'#3a2a24',1.4,1)+P([[188,108],[202,108],[200,140],[190,140]],'#c9925a',.6);
  o+=`<g class="bob">${card(p,ph,195,280,3,.62,{hearts:5})}</g>`;
  seed(601);const hs=[[120,140],[268,118],[300,300],[96,320],[180,96],[250,330],[330,190],[70,220]];
  hs.forEach(([x,y],i)=>{const dx=(J(1)>0?1:-1)*(80+rnd()*80),dy=-60-rnd()*120;o+=`<g class="heart" style="--dx:${dx}px;--dy:${dy}px;--r:${J(40)}deg;animation-delay:${.3+i*.55}s;transform-origin:${x}px ${y}px">${heart(x,y,22+rnd()*10,i%3?M.heart:M.heart2)}</g>`;});
  return o+hit(90,140,220,280,'go:S13','открытка')+hit(18,700,150,110,'go:S20','жестянка');});

def('S15','Тесто кончилось','Последний шарик ушёл: на подносе мука. Сом накрывает поднос полотенцем — без слов ясно, что на сегодня всё. Газ гаснет сам. Тап — итог вечера.',(p,ph)=>{
  let o=wide(p,ph,{som:1,somMood:'warm',somGest:'cover',somO:{at:[150,456]}})+light(p,ph)+bulb(p,ph)+counter(p,{heat:0,balls:0,flour:1});
  o+=coverCloth(40,560,150,70)+`<g class="pop">${B(176,602,10,7,M.skin2,1)}</g>`;
  return o+ring(195,560,30)+hit(0,140,390,700,'go:S16','итог');});

def('S16','Итог вечера','Лист крафт-бумаги: кто был (портреты), что принесли, сколько роти (квадратиками, без цифр), и миска теста под полотенцем с часами — когда оно отдохнёт. Штамп-галочка — ок.',(p,ph)=>{
  seed(2601);let o=wide(p,ph,{})+light(p,ph)+dim(.35);
  o+=P([[24,130],[368,122],[372,790],[20,798]],'#1a120c',2,'opacity=".35" transform="translate(5 7)"')+kraft(22,124,346,668,0,'#dcb985');
  const who=[['morning',0],['day',1],['evening',2],[ph,3]];
  who.forEach(([g,i])=>{const x=74+i*82;o+=mini(g,x,210,32,i==3?'joy':'warm');o+=`<g transform="translate(${x} 300) scale(.55) translate(${-x} -300)">${gift(g,x,300)}</g>`;});
  o+=L([[40,350],[350,344]],'#7a5a3a',1.6,1,'opacity=".6"');
  for(let i=0;i<5;i++){const x=58+i*46;o+=P([[x,384],[x+34,382],[x+35,416],[x+1,418]],M.gold,1)+B(x+12,y0(i),3,2,M.dark,.4);}
  function y0(i){return 396+i%2*6;}
  o+=heart(306,398,26,M.heart)+heart(334,410,18,M.heart2);
  o+=L([[40,450],[350,444]],'#7a5a3a',1.6,1,'opacity=".6"');
  o+=doughBowl(120,560,1)+clockFace(266,548,46,(S.h+8)%24,M.ink,'#fbf7ee')+B(266,480,12,12,'#f7c430',1)+T(180,556,'→',30,M.ink,'Pangolin');
  o+=T(48,650,'тоньше край — получилось',22,M.somNote,'Neucha','transform="rotate(-2 48 650)"');
  o+=B(195,734,40,40,'#3e8f74',2)+L([[176,734],[190,750],[216,716]],'#fbf7ee',5,.4);
  return o+ring(195,734,46)+hit(140,680,110,110,'go:S17','ок');});

def('S17','Тележка закрыта','Навес свёрнут, сталь под полотенцем. Открытка висит на прищепке — сердечки могут прийти и сейчас. Жестянка открыта всегда: тетрадь, рецепты, обещания. Игра не просит ждать.',(p,ph)=>{
  let o=wide(p,ph,{closed:1})+light(p,ph);seed(2701);
  o+=L([[-10,96],[195,120],[400,92]],'#3a2a24',1.4,1)+`<g class="bob">${card(p,ph,300,250,4,.42,{hearts:2})}</g>`;
  o+=coverCloth(14,560,362,150)+tinBox(18,706,150,96)+knob(344,774,0);
  o+=`<g class="ring">${OB(93,754,92,62,'#fff6dc',2.4,2)}</g>`;
  return o+hit(18,700,150,110,'go:S20','жестянка')+hit(230,140,140,220,'go:S14','открытка');});

def('S18','Вход в другой час','Вход в другой час: место — по новому часу; тесто ещё отдыхает (миска под полотенцем, часы — когда будет готово), но на открытке уже сердечки, и жестянка открыта. Когда тесто готово — это просто S04.',(p,ph)=>{
  let o=wide(p,ph,{guest:1,mood:'joy'})+light(p,ph)+bulb(p,ph);seed(2801);
  o+=L([[-10,96],[195,120],[400,92]],'#3a2a24',1.4,1)+`<g class="bob">${card(p,ph,320,236,4,.4,{hearts:4})}</g>`;
  o+=doughBowl(100,640,1)+clockFace(176,612,26,(S.h+3)%24,M.ink,'#fbf7ee')+cloth(192,724)+tava(290,652,84,70,0)+tinBox(18,706,150,96)+knob(344,774,0);
  o+=`<g class="ring">${OB(93,754,92,62,'#fff6dc',2.4,2)}</g>`;
  return o+hit(18,700,150,110,'go:S20','жестянка')+hit(250,140,140,200,'go:S14','открытка')+hit(306,736,76,76,'go:S04','кран (когда тесто готово)');});

def('S20','Жестянка → меню','Тап по жестянке: крышка откидывается, внутри отделения — тетрадь, рецепты, обещания, сложенная карта мест, открытки, ключик настроек. Тап по месту наверху — закрыть.',(p,ph)=>{
  let o=wide(p,ph,{})+light(p,ph)+dim(.5)+tinOpen(p,ph);
  TINITEMS.forEach(([id,lbl,x,y,w,h])=>{o+=tinItem(id,x,y,w,h,p,ph)+hit(x,y,w,h,'go:'+id,lbl);});
  return o+hit(0,0,390,290,'go:S04','закрыть жестянку');});

def('S21','Следы роти','Тетрадь в пятнах масла: каждый день — страница, роти нарисованы как сделаны, гость наклейкой, пометки Сом фиолетовым. Сердечки, что пришли, — здесь же.',(p,ph)=>{
  seed(2901);let o=wide(p,ph,{})+dim(.6)+notebookFrame(p);
  o+=T(30,196,'23.11',24,M.ink)+T(112,196,p.where,17,M.ink);
  o+=rotiCut(80,270,80,1)+mini(ph,160,262,26,'joy')+`<g transform="translate(150 330) scale(.5) translate(-150 -330)">${gift(ph,150,330)}</g>`;
  o+=heart(40,372,16,M.heart)+heart(60,380,14,M.heart2)+heart(80,372,16,M.heart);
  o+=T(30,430,'края хрустят!',20,'#7a3f17')+T(64,460,'тоньше',20,M.somNote)+arrow([[60,452],[46,436]],M.somNote);
  o+=rotiCut(70,560,60,0)+mini('morning',150,552,22,'calm')+T(30,640,'утром — без сахара',17,M.ink);
  o+=T(212,196,'22.11',22,M.ink)+T(282,196,'вечер',17,M.ink);
  [0,1,2].forEach(i=>{o+=rotiCut(250,260+i*92,58,i!=1)+mini(['evening','evening','night'][i],326,256+i*92,22,'warm');});
  o+=T(212,540,'21.11',22,M.ink)+rotiCut(250,600,58,1)+mini('day',326,596,22,'joy')+T(212,690,'уголок сгорел',17,M.somNote);
  return o+backTab();});

def('S22','Рецепты','Карточки без слов: что положить → какой роти выйдет. Знакомые — цветные, со звёздочкой Сом; ещё не открытые — бледный карандаш с вопросом.',(p,ph)=>{
  seed(3001);let o=wide(p,ph,{})+dim(.6);
  [[24,150,'banana'],[204,160,'sugar'],[24,450,'mango'],[204,460,'?']].forEach(([x,y,k],i)=>{const ok=k!='?'&&k!='mango';
    o+=P([[x,y],[x+164,y-4],[x+168,y+272],[x+4,y+276]],ok?'#fbf7ee':'#efe8d8',2)+MR(wp([[x,y],[x+164,y-4],[x+168,y+272],[x+4,y+276]],0),'#9a8a6a');
    const op=ok?1:.4;o+=`<g opacity="${op}">`;
    if(k=='banana')o+=`<path d="${wl([[x+30,y+80],[x+40,y+48],[x+60,y+30]],.5)}" stroke="${M.banana}" stroke-width="11" stroke-linecap="round" fill="none"/>`+B(x+104,y+56,13,17,'#f4e6cf',.8)+OB(x+104,y+56,13,17,'#b8a07a',1.2,.5);
    if(k=='sugar')o+=milkCan(x+50,y+90,0)+sugar(x+118,y+60,22,26);
    if(k=='mango')o+=B(x+60,y+60,30,20,'#f2b23a',1.6,'',-.3)+P([[x+108,y+40],[x+140,y+38],[x+142,y+80],[x+110,y+82]],'#fbf0d0',1);
    if(k=='?')o+=T(x+64,y+90,'?',70,'#9a8a6a','Pangolin');
    o+=T(x+74,y+140,'↓',30,M.ink,'Pangolin')+rotiCut(x+84,y+214,90,k!='banana')+'</g>';
    if(ok)o+=B(x+148,y+18,10,10,M.somNote,.4)+T(x+140,y+24,'★',18,'#fbf7ee','Pangolin');});
  return o+backTab();});

def('S23','Обещания','Кому что обещано: гость → что приготовить → когда (солнце, луна). Выполненное — зелёная галочка мелком.',(p,ph)=>{
  seed(3101);let o=wide(p,ph,{})+dim(.6);
  [['morning','утро',0],['evening','вечер',1],['night','ночь',0],['day','день',1]].forEach(([g,lbl,done],i)=>{const y=160+i*150;
    o+=P([[24,y],[366,y-4],[368,y+124],[22,y+128]],'#fbf7ee',2)+MR(wp([[24,y],[366,y-4],[368,y+124],[22,y+128]],0),'#9a8a6a')+B(195,y-2,10,6,M.tin,.4);
    o+=mini(g,76,y+62,40,'calm')+T(130,y+74,'→',30,M.ink,'Pangolin');
    o+=P([[170,y+38],[214,y+36],[216,y+80],[172,y+82]],M.gold,1.4)+P([[184,y+46],[228,y+44],[230,y+88],[186,y+90]],M.gold,1.4)+(g=='morning'?`<path d="${wl([[244,y+86],[250,y+60],[264,y+44]],.4)}" stroke="${M.banana}" stroke-width="9" stroke-linecap="round" fill="none"/>`:'');
    o+=(['morning','day'].includes(g)?B(312,y+60,16,16,'#f7c430',1):B(312,y+60,15,15,'#f3efd6',1)+B(320,y+54,12,12,'#fbf7ee',1));
    if(done)o+=L([[290,y+90],[306,y+108],[352,y+40]],'#3e8f74',5,.4);});
  return o+backTab();});

def('S24','Места по часам','Только справка: место выбирает час телефона. Циферблат 24 ч, сектора — фазы; в каждом — своё место; рука — сейчас. В 0–5 ч тележка спит.',(p,ph)=>{
  seed(3201);let o=wide(p,ph,{})+dim(.6);const cx=195,cy=470,R0=168;
  o+=B(cx+4,cy+6,R0+8,R0+8,'#1a120c',3,'opacity=".4"')+B(cx,cy,R0+8,R0+8,'#e9dcbc',3);
  const sec=[['deep',0,5],['morning',5,11],['day',11,16],['evening',16,19.5],['night',19.5,24]];
  sec.forEach(([k,a,b])=>{const pp=PH[k],a0=a/24*6.283-1.571,a1=b/24*6.283-1.571;const pts=[[cx,cy]];for(let t=a0;t<=a1+.001;t+=.08)pts.push([cx+Math.cos(t)*R0,cy+Math.sin(t)*R0]);pts.push([cx+Math.cos(a1)*R0,cy+Math.sin(a1)*R0]);
    const d=curve(pts);const cid='sg'+k;o+=`<path d="${d}" fill="${pp.paper}"/>`;
    const am=(a0+a1)/2,mx=cx+Math.cos(am)*R0*.6,my=cy+Math.sin(am)*R0*.6;
    o+=`<clipPath id="${cid}"><path d="${wb(mx,my,40,40,1.4)}"/></clipPath><g clip-path="url(#${cid})"><g transform="translate(${mx-40} ${my-40}) scale(.21) translate(0 -60)">${place(pp,k)}</g></g>`+OB(mx,my,40,40,pp.ink,2,1);
    o+=L([[cx,cy],[cx+Math.cos(a0)*R0,cy+Math.sin(a0)*R0]],M.ink,1.6,.6,'opacity=".6"');});
  for(let i=0;i<24;i+=3){const a=i/24*6.283-1.571;o+=T(cx+Math.cos(a)*(R0+26)-8,cy+Math.sin(a)*(R0+26)+6,String(i),16,'#fbf7ee','Pangolin');}
  const ah=S.h/24*6.283-1.571;o+=L([[cx,cy],[cx+Math.cos(ah)*R0*.95,cy+Math.sin(ah)*R0*.95]],M.tin,5,.4)+B(cx,cy,10,10,M.tin,.6)+B(cx+Math.cos(ah)*R0*.95,cy+Math.sin(ah)*R0*.95,8,8,M.tin,.6);
  return o+backTab();});

def('S25','Настройки','Ключик: здесь текст можно — это служебное. Звук по умолчанию выключен. Время берётся из часов телефона. Рука: правая или левая (#28). Показывать роти миру — по желанию. Сменить героя (#107).',(p,ph)=>{
  seed(3301);let o=wide(p,ph,{})+dim(.6);
  o+=P([[20,150],[370,146],[374,800],[16,804]],'#f4ead2',2)+MR(wp([[20,150],[370,146],[374,800],[16,804]],0),'#9a8a6a');
  o+=OB(70,196,18,18,'#c98a2c',5,.6)+P([[86,192],[150,190],[150,200],[86,202]],'#c98a2c',.6);
  const rows=[['звук','выкл.',0],['время суток — по часам телефона','',2],['рука','правая',1],['показывать роти миру','да',1],['герой','сестра',3]];
  rows.forEach(([a,b,on],i)=>{const y=270+i*104;o+=T(40,y,a,i==1?19:24,M.ink,'Pangolin');
    if(on<2){o+=P([[260,y-28],[344,y-30],[346,y+6],[262,y+8]],on?'#3e8f74':'#b9ad94',1.6)+B(on?324:282,y-11,16,15,'#fbf7ee',1)+T(40,y+30,b,18,'#7a5a3a','Neucha');
      if(!on&&i==0)o+=P([[200,y-24],[212,y-24],[224,y-34],[224,y+4],[212,y-6],[200,y-6]],'#7a5a3a',.6)+L([[230,y-26],[246,y-4]],M.tin,2.6,.3)+L([[246,y-26],[230,y-4]],M.tin,2.6,.3);}
    else if(on==2)o+=clockFace(300,y+10,26,S.h,M.ink,'#fbf7ee');
    else o+=mini('morning',300,y-6,0.1,'calm').slice(0,0)+`<g transform="translate(300 ${y-8})">${B(0,0,30,30,'#f3e6c8',1)}</g>`+T(40,y+30,b,18,'#7a5a3a','Neucha');
    o+=L([[34,y+48],[356,y+46]],'#c4b28a',1.2,1,'opacity=".7"');});
  return o+backTab();});


/* ---------- render & navigation ---------- */
const sel=document.getElementById('sel'),hr=document.getElementById('hr'),fadeSvg=document.getElementById('fade');
sel.innerHTML=GROUPS.map(([g,ids])=>`<optgroup label="${g}">`+ids.map(id=>`<option value="${id}">${id} · ${SC[id].name}</option>`).join('')+'</optgroup>').join('');
window.__perf={};
function curPh(){return S.lock||phase(S.h);}
function render(){const t=performance.now();clipN=0;const ph=curPh(),p=PH[ph];
  const scr=SC[S.id];let body=scr.draw(p,ph);
  // tooth goes over the drawing but under the hit areas
  const HR=/<rect class="hit"[^>]*>.*?<\/rect>/g;const hits=(body.match(HR)||[]).join(''),draw=body.replace(HR,'');
  svg.innerHTML=defs(ph)+paperLayer(p)+draw+tooth()+hits;
  window.__perf.render=+(performance.now()-t).toFixed(1);window.__perf.bake=BK[ph].ms;
  const hh=Math.floor(S.h),mm=Math.round((S.h-hh)*60)%60,real=phase(S.h);
  document.getElementById('hl').textContent=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')+' · '+PH[real].name;
  sel.value=S.id;
  let cap=S.id+' · '+scr.name+' — '+scr.cap;
  if(S.lock&&S.lock!=real)cap='⏳ Час сменился ('+PH[real].name+'), но роти в работе: доготовьте и подайте — сцена сменится мягко после. '+cap;
  document.getElementById('cap').textContent=cap;
  const u=new URL(location.href);u.searchParams.set('s',S.id);u.searchParams.set('h',S.h.toFixed(2));history.replaceState(null,'',u);}
function crossfade(){// soft change of the scene: the old picture fades over the new one
  fadeSvg.innerHTML=svg.innerHTML.replace(/id="([\w-]+)"/g,'id="f_$1"').replace(/url\(#([\w-]+)\)/g,'url(#f_$1)').replace(/class="hit"/g,'');
  fadeSvg.style.transition='none';fadeSvg.style.opacity=1;fadeSvg.getBoundingClientRect();fadeSvg.style.transition='';fadeSvg.style.opacity=0;}
function go(id){if(!SC[id])return;const prev=curPh();
  if(COOK.has(id)){if(!S.lock)S.lock=phase(S.h);}else if(S.lock){S.lock=null;}
  if(id!=S.id){S.flip=false;S.k=1;S.warm=false;}
  const changed=prev!=curPh();if(changed)crossfade();
  S.id=id;render();}
svg.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a.startsWith('go:'))go(a.slice(3));
  else if(a=='warm'){S.warm=true;render();setTimeout(()=>go('S05'),900);}
  else if(a=='stretch'){S.k++;if(S.k>3)go('C3');else render();}
  else if(a=='flip'){if(!S.flip){S.flip=true;render();}else go('C7');}
  else if(a.startsWith('hero:')){S.hero=a.slice(5);render();setTimeout(()=>go('S04'),700);}
});
const step=d=>{const i=ORDER.indexOf(S.id);go(ORDER[(i+d+ORDER.length)%ORDER.length]);};
document.getElementById('pv').onclick=()=>step(-1);document.getElementById('nx').onclick=()=>step(1);
document.getElementById('mn').onclick=()=>document.getElementById('rev').classList.toggle('min');
sel.onchange=()=>go(sel.value);
hr.oninput=()=>{const prev=curPh();S.h=+hr.value;if(prev!=curPh())crossfade();render();};
window.__set=o=>{Object.assign(S,o);hr.value=S.h;render();};
{const s0=(q.get('s')||'S01').toUpperCase();S.id=SC[s0]?s0:'S01';if(COOK.has(S.id))S.lock=phase(S.h);hr.value=S.h;}
render();
window.__perf.firstScript=+(performance.now()-T0).toFixed(1);
requestAnimationFrame(()=>requestAnimationFrame(()=>{window.__perf.frame2=+(performance.now()-T0).toFixed(1);}));
document.fonts&&document.fonts.ready.then(()=>{render();window.__perf.fonts=+(performance.now()-T0).toFixed(1);
  const idle=window.requestIdleCallback||(f=>setTimeout(f,200));idle(()=>PHS.forEach(bake));});
</script>
