></text><circle cx="30" cy="158" r="6.3" fill="#9a9a9a" stroke="none" stroke-width="1.5"/><path d="M20.200000000000003,181.8 Q20.9,165.7 30,165.7 Q39.1,165.7 39.8,181.8 Z" fill="#9a9a9a"/><path d="M50,174 h20" fill="none" stroke="#555" stroke-width="1.6" marker-end="url(#tiny)"/><rect x="87.0" y="165.0" width="22" height="22" rx="6" fill="#e8c27a" stroke="#a27b2c" stroke-width="1.5"/><text x="128" y="180" font-size="11" text-anchor="middle" font-weight="normal" fill="#555"><tspan x="128" dy="0.0">×2</tspan></text><text x="75" y="250" font-size="10" text-anchor="middle" font-weight="normal" fill="#555"><tspan x="75" dy="0.0">не квесты — долги</tspan><tspan x="75" dy="12.2">и договорённости</tspan></text></g></g><rect x="2390" y="164" width="40.5" height="22" rx="5" fill="#333"/><text x="2410.25" y="180" font-size="14" text-anchor="middle" font-weight="700" fill="#fff"><tspan x="2410.25" dy="0.0">S23</tspan></text><text x="2436.5" y="181" font-size="15" text-anchor="start" font-weight="700" fill="#1d1d1f"><tspan x="2436.5" dy="0.0">Обещания</tspan></text><g transform="translate(2590,200)"><rect x="-4" y="-4" width="158" height="308" rx="22" fill="#fff" stroke="#6b6b6b" stroke-width="3" stroke-dasharray="10 7"/><g transform="scale(1.0000,1.0000)"><rect x="0" y="0" width="150" height="300" rx="18" fill="#fafafa" stroke="none" stroke-width="1.5"/><rect x="55" y="7" width="40" height="7" rx="3.5" fill="#cfcfcf" stroke="none" stroke-width="1.5"/><circle cx="75" cy="92" r="58" fill="#fff" stroke="#555" stroke-width="2"/><path d="M75,92 L75.04618694922253,34.000018389953595" stroke="#555"/><path d="M75,92 L133.0,92.0" stroke="#555"/><path d="M75,92 L75.04618694922253,149.9999816100464" stroke="#555"/><path d="M75,92 L17.000073559802708,92.09237386915623" stroke="#555"/><text x="110" y="75" font-size="9" text-anchor="middle" font-weight="normal" fill="#555"><tspan x="110" dy="0.0">школа</tspan></text><text x="110" y="120" font-size="9" text-anchor="middle" font-weight="normal" fill="#555"><tspan x="110" dy="0.0">пристань</tspan></text><text x="42" y="120" font-size="9" text-anchor="middle" font-weight="normal" fill="#555"><tspan x="42" dy="0.0">канал</tspan></text><text x="42" y="75" font-size="9" text-anchor="middle" font-weight="normal" fill="#555"><tspan x="42" dy="0.0">рынок</tspan></text><rect x="14" y="170" width="122" height="90" rx="6" fill="#e3eedc" stroke="none" stroke-width="1.5"/><circle cx="40" cy="200" r="6" fill="#d7263d" stroke="none" stroke-width="1.5"/><circle cx="100" cy="230" r="6" fill="#9a9a9a" stroke="none" stroke-width="1.5"/><text x="75" y="280" font-size="10" text-anchor="middle" font-weight="normal" fill="#555"><tspan x="75" dy="0.0">карта или сцены?</tspan></text></g><rect x="75.2" y="-16" width="82.8" height="24" rx="12" fill="#fff4d6" stroke="#c99a12" stroke-width="1.5"/><text x="116.6" y="1" font-size="14" text-anchor="middle" font-weight="700" fill="#8a6500"><tspan x="116.6" dy="0.0">#100 #63</tspan></text></g><rect x="2590" y="164" width="40.5" height="22" rx="5" fill="#333"/><text x="2610.25" y="180" font-size="14" text-anchor="middle" font-weight="700" fill="#fff"><tspan x="2610.25" dy="0.0">S24</tspan></text><text x="2636.5" y="181" font-size="15" text-anchor="start" font-weight="700" fill="#1d1d1f"><tspan x="2636.5" dy="0.0">Места по часам</tspan></text><text x="1990" y="610" font-size="15" text-anchor="start" font-weight="700" fill="#d9730d"><tspan x="1990" dy="0.0">Из любой вкладки:</tspan></text><path d="M2140,640 L2000,640" fill="none" stroke="#d9730d" stroke-width="2.6"  marker-end="url(#a-back)"/><text x="2155" y="645" font-size="14" text-anchor="start" font-weight="600" fill="#d9730d"><tspan x="2155" dy="0.0">назад → тетрадь;  ещё назад / смахнуть</tspan></text><text x="2155" y="665" font-size="14" text-anchor="start" font-weight="600" fill="#d9730d"><tspan x="2155" dy="0.0">вниз → S04 (туда, откуда открыли)</tspan></text><text x="1990" y="712" font-size="14" text-anchor="start" font-weight="normal" fill="#444"><tspan x="1990" dy="0.0">S24 «Места по часам» — только справка: место</tspan><tspan x="1990" dy="17.1">всё равно выбирает час (❓1). Личный мир —</tspan><tspan x="1990" dy="17.1">#110, идея, экрана пока нет.</tspan></text><rect x="1990" y="790" width="330" height="120" rx="12" fill="none" stroke="#6b6b6b" stroke-width="2" stroke-dasharray="10 7"/><text x="2005" y="815" font-size="14" text-anchor="start" font-weight="600" fill="#555"><tspan x="2005" dy="0.0">#109 · #71 · #100 — экраны-идеи:</tspan><tspan x="2005" dy="17.1">пунктир, решения ещё нет</tspan></text><text x="2005" y="870" font-size="13" text-anchor="start" font-weight="normal" fill="#555"><tspan x="2005" dy="0.0">обещания — в действующем</tspan><tspan x="2005" dy="15.9">дизайн-доке, без экрана</tspan></text><g transform="translate(2810,560)"><rect x="-4" y="-4" width="158" height="308" rx="22" fill="#fff" stroke="#2f2f2f" stroke-width="3"/><g transform="scale(1.0000,1.0000)"><rect x="0" y="0" width="150" height="300" rx="18" fill="#fafafa" stroke="none" stroke-width="1.5"/><rect x="55" y="7" width="40" height="7" rx="3.5" fill="#cfcfcf" stroke="none" stroke-width="1.5"/><rect x="0" y="0" width="150" height="300" rx="18" fill="#000" opacity="0.25"/><rect x="6" y="110" width="138" height="184" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="20" y="140" font-size="12" text-anchor="start" font-weight="700" fill="#555"><tspan x="20" dy="0.0">звук</tspan></text><rect x="98" y="128" width="36" height="18" rx="9" fill="#d6d6d6" stroke="none" stroke-width="1.5"/><circle cx="107" cy="137" r="7" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="112" y="160" font-size="9" text-anchor="middle" font-weight="normal" fill="#555"><tspan x="112" dy="0.0">выкл</tspan></text><text x="20" y="185" font-size="11" text-anchor="start" font-weight="normal" fill="#555"><tspan x="20" dy="0.0">левая рука</tspan></text><rect x="98" y="173" width="36" height="18" rx="9" fill="#d6d6d6" stroke="none" stroke-width="1.5"/><circle cx="107" cy="182" r="7" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="20" y="225" font-size="11" text-anchor="start" font-weight="normal" fill="#555"><tspan x="20" dy="0.0">герой</tspan></text><circle cx="115" cy="210" r="4.5" fill="#9a9a9a" stroke="none" stroke-width="1.5"/><path d="M108.0,227.0 Q108.5,215.5 115,215.5 Q121.5,215.5 122.0,227.0 Z" fill="#9a9a9a"/><rect x="40" y="256" width="70" height="24" rx="12" fill="#fff" stroke="#555" stroke-width="1.5"/><text x="75" y="272" font-size="11" text-anchor="middle" font-weight="600" fill="#555"><tspan x="75" dy="0.0">закрыть</tspan></text></g></g><rect x="2810" y="524" width="40.5" height="22" rx="5" fill="#333"/><text x="2830.25" y="540" font-size="14" text-anchor="middle" font-weight="700" fill="#fff"><tspan x="2830.25" dy="0.0">S25</tspan></text><text x="2856.5" y="541" font-size="15" text-anchor="start" font-weight="700" fill="#1d1d1f"><tspan x="2856.5" dy="0.0">Настройки</tspan></text><text x="2810" y="892" font-size="12" text-anchor="start" font-weight="normal" fill="#444"><tspan x="2810" dy="0.0">звук выкл. по умолч.</tspan><tspan x="2810" dy="14.6">(17.11); левая рука —</tspan><tspan x="2810" dy="14.6">#28; герой — #107</tspan></text><path d="M2962,610 L2982,610 L2982,470 L2972,470" fill="none" stroke="#d9730d" stroke-width="2.6"  marker-end="url(#a-back)"/><text x="2790" y="455" font-size="13" text-anchor="start" font-weight="600" fill="#d9730d"><tspan x="2790" dy="0.0">закрыть /</tspan><tspan x="2790" dy="15.9">тап мимо</tspan></text><circle cx="2940" cy="470" r="27" fill="#fff" stroke="#d9730d" stroke-width="3"/><text x="2940" y="476" font-size="15" text-anchor="middle" font-weight="700" fill="#d9730d"><tspan x="2940" dy="0.0">→S04</tspan></text><path d="M3045,160 L3115,160" fill="none" stroke="#1d1d1f" stroke-width="3"  marker-end="url(#a-act)"/><text x="3130" y="165" font-size="16" text-anchor="start" font-weight="normal" fill="#222"><tspan x="3130" dy="0.0">действие игрока — подпись: жест или тап</tspan></text><path d="M3045,196 L3115,196" fill="none" stroke="#7a7a7a" stroke-width="2.6" stroke-dasharray="8 6" marker-end="url(#a-auto)"/><text x="3130" y="201" font-size="16" text-anchor="start" font-weight="normal" fill="#222"><tspan x="3130" dy="0.0">происходит само: время, условие, переход</tspan></text><path d="M3045,232 L3115,232" fill="none" stroke="#d9730d" stroke-width="2.6"  marker-end="url(#a-back)"/><text x="3130" y="237" font-size="16" text-anchor="start" font-weight="normal" fill="#222"><tspan x="3130" dy="0.0">назад / закрыть</tspan></text><path d="M3045,268 L3115,268" fill="none" stroke="#7a7a7a" stroke-width="2.6" stroke-dasharray="3 5" marker-end="url(#a-auto)"/><text x="3130" y="273" font-size="16" text-anchor="start" font-weight="normal" fill="#222"><tspan x="3130" dy="0.0">позже, в реальном времени</tspan></text><rect x="3045" y="315" width="50" height="34" rx="8" fill="#fff" stroke="#2f2f2f" stroke-width="3"/><text x="3110" y="338" font-size="16" text-anchor="start" font-weight="normal" fill="#222"><tspan x="3110" dy="0.0">экран или состояние — решено (в доке / в решениях)</tspan></text><rect x="3045" y="361" width="50" height="34" rx="8" fill="#fff" stroke="#6b6b6b" stroke-width="3" stroke-dasharray="10 7"/><text x="3110" y="384" font-size="16" text-anchor="start" font-weight="normal" fill="#222"><tspan x="3110" dy="0.0">только идея — номер issue на жёлтой метке</tspan></text><circle cx="3070" cy="425" r="14" fill="#2e9e5b"/><text x="3070" y="431" font-size="17" text-anchor="middle" font-weight="700" fill="#fff"><tspan x="3070" dy="0.0">✓</tspan></text><text x="3110" y="431" font-size="16" text-anchor="start" font-weight="normal" fill="#222"><tspan x="3110" dy="0.0">уже работает на стенде</tspan></text><circle cx="3070" cy="475" r="27" fill="#fff" stroke="#1d1d1f" stroke-width="3"/><text x="3070" y="481" font-size="15" text-anchor="middle" font-weight="700" fill="#1d1d1f"><tspan x="3070" dy="0.0">→S05</tspan></text><text x="3110" y="481" font-size="16" text-anchor="start" font-weight="normal" fill="#222"><tspan x="3110" dy="0.0">переход к экрану с этим номером (без длинной стрелки)</tspan></text><path d="M3070,505 l26,22 l-26,22 l-26,-22 z" fill="#fff" stroke="#2f2f2f" stroke-width="2.5"/><text x="3110" y="533" font-size="16" text-anchor="start" font-weight="normal" fill="#222"><tspan x="3110" dy="0.0">развилка по условию</tspan></text><circle cx="3070" cy="577" r="19" fill="#d7263d"/><text x="3070" y="584" font-size="18" text-anchor="middle" font-weight="800" fill="#fff"><tspan x="3070" dy="0.0">?</tspan></text><text x="3110" y="583" font-size="16" text-anchor="start" font-weight="700" fill="#d7263d"><tspan x="3110" dy="0.0">место, где поток неясен — нужно решение</tspan></text><text x="3045" y="630" font-size="17" text-anchor="start" font-weight="700" fill="#d7263d"><tspan x="3045" dy="0.0">❓1  Выбирает ли игрок место?</tspan></text><text x="3045" y="653" font-size="14.5" text-anchor="start" font-weight="normal" fill="#333"><tspan x="3045" dy="0.0">Час жёстко ставит место (23.11) — тогда карта S24 лишь</tspan><tspan x="3045" dy="17.7">справка; или на карте выбор из открытых сейчас (#100, #63).</tspan><tspan x="3045" dy="17.7">И где «утро дома» с замесом (#39) — свой экран или его нет.</tspan></text><text x="3045" y="728.4" font-size="17" text-anchor="start" font-weight="700" fill="#d7263d"><tspan x="3045" dy="0.0">❓2  Чем кончается вечер — тестом или часом?</tspan></text><text x="3045" y="751.4" font-size="14.5" text-anchor="start" font-weight="normal" fill="#333"><tspan x="3045" dy="0.0">Игрок у канала, а часы перешли в «ночь»: сцена меняется</tspan><tspan x="3045" dy="17.7">сразу, после текущего роти или вечер доигрывается до S16?</tspan></text><text x="3045" y="809.1" font-size="17" text-anchor="start" font-weight="700" fill="#d7263d"><tspan x="3045" dy="0.0">❓3  Тесто кончилось, а вход в другой час</tspan></text><text x="3045" y="832.1" font-size="14.5" text-anchor="start" font-weight="normal" fill="#333"><tspan x="3045" dy="0.0">Новое место есть, шариков нет (восполнение — реальное</tspan><tspan x="3045" dy="17.7">время, #67): тележка закрыта, или можно смотреть, листать</tspan><tspan x="3045" dy="17.7">тетрадь, ловить сердечки? Что видно на S18?</tspan></text><g transform="translate(130,1065)"><rect x="-4" y="-4" width="158" height="308" rx="22" fill="#fff" stroke="#2f2f2f" stroke-width="3"/><g transform="scale(1.0000,1.0000)"><rect x="0" y="0" width="150" height="300" rx="18" fill="#fafafa" stroke="none" stroke-width="1.5"/><rect x="55" y="7" width="40" height="7" rx="3.5" fill="#cfcfcf" stroke="none" stroke-width="1.5"/><rect x="6" y="40" width="138" height="246" rx="6" fill="#ece6da" stroke="none" stroke-width="1.5"/><circle cx="75" cy="150" r="30" fill="#efe3c8" stroke="#b9a77f" stroke-width="1.5"/><circle cx="75" cy="150" r="46" fill="none" stroke="#b9a77f" stroke-width="1.3" stroke-dasharray="4 3"/><circle cx="75" cy="150" r="7" fill="#ffcf99" stroke="#d9730d" stroke-width="1.5"/><text x="75" y="260" font-size="10" text-anchor="middle" font-weight="normal" fill="#555"><tspan x="75" dy="0.0">прижать — плющить</tspan></text></g><circle cx="148" cy="298" r="14" fill="#2e9e5b"/><text x="148" y="304" font-size="17" text-anchor="middle" font-weight="700" fill="#fff"><tspan x="148" dy="0.0">✓</tspan></text></g><rect x="130" y="1029" width="31.0" height="22" rx="5" fill="#333"/><text x="145.5" y="1045" font-size="14" text-anchor="middle" font-weight="700" fill="#fff"><tspan x="145.5" dy="0.0">C1</tspan></text><text x="167.0" y="1046" font-size="16" text-anchor="start" font-weight="700" fill="#1d1d1f"><tspan x="167.0" dy="0.0">Шарик → диск</tspan></text><text x="130" y="1391" font-size="13" text-anchor="start" font-weight="normal" fill="#444"><tspan x="130" dy="0.0">камера: стол</tspan></text><path d="M288,1210 L544,1210" fill="none" stroke="#1d1d1f" stroke-width="3"  marker-end="url(#a-act)"/><rect x="351" y="1164" width="1 <div id="h">двумя пальцами — ближе/дальше, одним — двигать; двойной тап — ближе</div>
<script>
const W=4000,H=2600,s=document.getElementById('b'),v=document.getElementById('v');let b={x:0,y:0,w:W,h:H};
if(location.search.includes('png'))document.body.classList.add('png');
function ap(){s.setAttribute('viewBox',b.x+' '+b.y+' '+b.w+' '+b.h)}
function fit(){const cw=v.clientWidth,ch=v.clientHeight,m=20;let w=W+2*m,h=w*ch/cw;if(h<H+2*m){h=H+2*m;w=h*cw/ch}b={x:W/2-w/2,y:H/2-h/2,w,h};ap()}
function k(){return b.w/v.clientWidth}
function zoom(f,cx,cy){const nw=Math.min(Math.max(b.w*f,300),W*3);const r=nw/b.w,px=b.x+cx*k(),py=b.y+cy*k();b.w=nw;b.h=b.h*r;b.x=px-(px-b.x)*r;b.y=py-(py-b.y)*r;ap()}
const P=new Map();let last=null,lastTap=0;
v.addEventListener('pointerdown',e=>{h.style.display='none';try{v.setPointerCapture(e.pointerId)}catch(_){}P.set(e.pointerId,{x:e.clientX,y:e.clientY});last=null;
 const n=Date.now();if(P.size==1&&n-lastTap<300)zoom(0.5,e.clientX,e.clientY);lastTap=n});
v.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;const o=P.get(e.pointerId);
 if(P.size==1){b.x-=(e.clientX-o.x)*k();b.y-=(e.clientY-o.y)*k();ap();P.set(e.pointerId,{x:e.clientX,y:e.clientY});return}
 P.set(e.pointerId,{x:e.clientX,y:e.clientY});const [a,c]=[...P.values()];const d=Math.hypot(a.x-c.x,a.y-c.y),mx=(a.x+c.x)/2,my=(a.y+c.y)/2;
 if(last){zoom(last.d/d,mx,my);b.x-=(mx-last.mx)*k();b.y-=(my-last.my)*k();ap()}last={d,mx,my}});
function up(e){P.delete(e.pointerId);last=null}
v.addEventListener('pointerup',up);v.addEventListener('pointercancel',up);
v.addEventListener('wheel',e=>{e.preventDefault();zoom(Math.exp(e.deltaY*(e.ctrlKey?0.01:0.0015)),e.clientX,e.clientY)},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
zi.onclick=()=>zoom(0.6,v.clientWidth/2,v.clientHeight/2);zo.onclick=()=>zoom(1.6,v.clientWidth/2,v.clientHeight/2);zf.onclick=fit;
addEventListener('resize',fit);fit();
