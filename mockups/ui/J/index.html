<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>Роти · J · линия и два цвета</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bad+Script&family=Literata:ital,opsz,wght@0,7..72,400;1,7..72,400&family=Mali:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#cfc9be;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;font-family:Literata,Georgia,serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#phone{position:relative;width:390px;height:844px;border-radius:48px;overflow:hidden;background:#F4EFE3;
  box-shadow:0 0 0 9px #1c1c1e,0 0 0 10px #55555a,0 30px 80px rgba(0,0,0,.35);transform-origin:center center}
#g{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#rev{position:fixed;left:18px;top:18px;width:300px;font:13px/1.4 Literata,serif;color:#2b2b2b;background:rgba(255,253,247,.94);
  border:1px solid #2b2b2b;border-radius:3px;padding:10px 12px;box-shadow:3px 3px 0 rgba(0,0,0,.18);z-index:5}
#rev b{font-weight:600}
#rev .row{display:flex;align-items:center;gap:8px;margin-top:8px}
#rev button{font:inherit;min-width:44px;min-height:36px;border:1px solid #2b2b2b;background:#fff;border-radius:3px;cursor:pointer}
#rev input[type=range]{flex:1}
#cap{margin-top:6px;min-height:3.9em}
#rev .x{position:absolute;right:6px;top:4px;border:0;background:none;min-width:28px;min-height:28px;font-size:16px}
#chip{display:none;position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 6px);z-index:6;font:13px Literata,serif;
  background:rgba(255,253,247,.9);border:1px solid #333;border-radius:3px;padding:6px 10px}
body.shot #rev,body.shot #chip{display:none}
body.shot #phone{border-radius:0;box-shadow:none}
body.shot #stage{align-items:flex-start;justify-content:flex-start}
@media (max-width:520px){
  #phone{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
  #rev{left:6px;right:6px;top:calc(env(safe-area-inset-top) + 4px);width:auto;font-size:12px;padding:6px 8px;background:rgba(255,253,247,.9)}
  #rev .row{margin-top:4px}
  #cap{min-height:0}
  body.hide #rev{display:none}
  body.hide #chip{display:block}
}
@keyframes fall{0%{transform:translate(40px,-260px) rotate(-30deg);opacity:0}
 15%{opacity:1}45%{transform:translate(-18px,-130px) rotate(12deg)}75%{transform:translate(9px,-38px) rotate(-6deg)}
 100%{transform:translate(0,0) rotate(0deg);opacity:1}}
.heart{animation:fall 4.2s cubic-bezier(.3,.1,.4,1) both}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.9}}
.pulse{animation:breathe 2.4s ease-in-out infinite}
</style>
</head>
<body>
<div id="stage"><div id="phone"><svg id="g" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg></div></div>
<div id="rev">
  <button class="x" id="hide" title="спрятать">×</button>
  <b>J · линия и два цвета</b> <span id="stn"></span>
  <div id="cap"></div>
  <div class="row"><button id="prev">◀</button><button id="next">▶</button>
    <span id="hl" style="min-width:92px"></span><button id="now">сейчас</button></div>
  <div class="row"><span>0</span><input id="hr" type="range" min="0" max="24" step="0.25"><span>24</span></div>
</div>
<button id="chip">J ◀▶</button>
<script>
'use strict';
const Q=new URLSearchParams(location.search), SHOT=Q.has('shot');
if(SHOT)document.body.classList.add('shot');
const svg=document.getElementById('g');
/* ---------- palettes: two inks per hour + paper + pen ---------- */
const PAL={
 morning:{key:'morning',paper:'#F4EFE3',ink:'#25313B',A:'#94B6D2',B:'#D39834',iron:'#2A3139',dough:'#F6EBD2',name:'утро',place:'у школьных ворот',guest:'школьница с рюкзаком'},
 day:{key:'day',paper:'#F6F2E6',ink:'#2B2A26',A:'#7FB2A0',B:'#DB8838',iron:'#2E2C29',dough:'#F6EAD0',name:'день',place:'в переулке у лавок',guest:'курьер на мопеде'},
 evening:{key:'evening',paper:'#F1E5D0',ink:'#1E2343',A:'#4A559C',B:'#E67A33',iron:'#22243A',dough:'#F4E5C8',name:'вечер',place:'у канала',guest:'женщина после работы'},
 night:{key:'night',paper:'#1B1F2D',ink:'#EEE4CD',A:'#5165AE',B:'#F1BF47',iron:'#0B0D15',dough:'#EBDCB6',name:'ночь',place:'на ночном рынке',guest:'парень из рыбной лавки',dark:true}};
const phaseOf=h=>h>=5&&h<11?'morning':h>=11&&h<17?'day':h>=17&&h<21?'evening':'night';
let P=PAL.morning, BL='multiply';
/* ---------- tiny pen library ---------- */
let R=Math.random,OUT=[],DEFS=[],HITS=[],cid=0,CP='c';
function seed(s){let a=s>>>0;R=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const j=a=>(R()-.5)*2*a, f=p=>p[0].toFixed(1)+','+p[1].toFixed(1);
const C=c=>P[c]||c;
function resample(pts,step=5){const o=[];for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],d=Math.hypot(b[0]-a[0],b[1]-a[1]),n=Math.max(1,Math.ceil(d/step));for(let k=0;k<n;k++){const t=k/n;o.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);}}o.push(pts[pts.length-1]);return o;}
function wobble(pts,amp=1){const p1=R()*6.28,p2=R()*6.28,f1=.045+R()*.05,f2=.14+R()*.1;let L=0;return pts.map((p,i)=>{if(i)L+=Math.hypot(p[0]-pts[i-1][0],p[1]-pts[i-1][1]);const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];let nx=-(b[1]-a[1]),ny=b[0]-a[0];const l=Math.hypot(nx,ny)||1;const o=amp*(Math.sin(L*f1+p1)*.72+Math.sin(L*f2+p2)*.28);return[p[0]+nx/l*o,p[1]+ny/l*o];});}
function ribbon(p,w,taper=.14){const n=p.length;if(n<2)return'';const L=[],Rr=[],ph=R()*6.28,fr=3+R()*4;for(let i=0;i<n;i++){const t=i/(n-1),tp=Math.pow(Math.max(0,Math.min(1,t/taper,(1-t)/taper)),.55),pr=.78+.3*Math.sin(t*fr+ph),ww=w*(.28+.72*tp)*pr/2;const a=p[Math.max(0,i-1)],b=p[Math.min(n-1,i+1)];let nx=-(b[1]-a[1]),ny=b[0]-a[0];const l=Math.hypot(nx,ny)||1;nx/=l;ny/=l;L.push([p[0+i][0]+nx*ww,p[i][1]+ny*ww]);Rr.push([p[i][0]-nx*ww,p[i][1]-ny*ww]);}return'M'+L.map(f).join('L')+'L'+Rr.reverse().map(f).join('L')+'Z';}
function ln(pts,w=1.5,col='ink',o={}){let p=o.raw?pts:resample(pts,o.step||5);p=wobble(p,o.amp??.8);OUT.push(`<path d="${ribbon(p,w,o.taper)}" fill="${C(col)}"${o.op!=null?` opacity="${o.op}"`:''}/>`);}
function closed(pts,w=1.4,col='ink',o={}){let p=resample(pts,5);if(Math.hypot(p[0][0]-p[p.length-1][0],p[0][1]-p[p.length-1][1])<1)p.pop();const n=p.length,s=Math.floor(R()*n),ex=Math.max(2,Math.round(n*(o.over??.07))),q=[];for(let i=0;i<=n+ex;i++)q.push(p[(s+i)%n]);ln(q,w,col,{...o,raw:true,taper:o.taper??.06});}
function dashed(pts,w=1.2,col='ink',o={}){const p=resample(pts,3.5);for(let i=0;i<p.length-2;i+=(o.gap||4))ln(p.slice(i,i+2+(o.len||1)),w,col,{raw:true,amp:.3,op:o.op});}
function fillp(pts,col='paper',op){OUT.push(`<path d="M${pts.map(f).join('L')}Z" fill="${C(col)}"${op!=null?` opacity="${op}"`:''}/>`);}
function wash(pts,col,op=1,o={}){const p=wobble(resample(pts,6),o.amp??1.4),m=o.mis??(col==='A'?[1.3,.9]:col==='B'?[-.9,.6]:[0,0]);OUT.push(`<path d="M${p.map(f).join('L')}Z" fill="${C(col)}" opacity="${op}" transform="translate(${m[0]},${m[1]})" filter="url(#${o.flat?'edge':'riso'})" style="mix-blend-mode:${o.blend||BL}"/>`);}
function clipOf(poly){const id=CP+(cid++);DEFS.push(`<clipPath id="${id}"><path d="M${poly.map(f).join('L')}Z"/></clipPath>`);return id;}
function hatch(poly,ang=45,gap=5,w=.7,col='ink',o={}){const id=clipOf(poly);const xs=poly.map(p=>p[0]),ys=poly.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys),cx=(x0+x1)/2,cy=(y0+y1)/2,r=Math.hypot(x1-x0,y1-y0)/2+4,a=ang*Math.PI/180,dx=Math.cos(a),dy=Math.sin(a),nx=-dy,ny=dx;const save=OUT;OUT=[];for(let s=-r;s<=r;s+=gap*(.8+R()*.4)){if(o.skip&&R()<o.skip)continue;if(o.fade&&(s+r)/(2*r)<R()*o.fade)continue;const tr=o.trim||0,t0=-r+R()*r*tr,t1=r-R()*r*tr;ln([[cx+nx*s+dx*t0,cy+ny*s+dy*t0],[cx+nx*s+dx*t1,cy+ny*s+dy*t1]],w*(.7+R()*.5),col,{amp:o.amp??.5,step:7,op:o.op,taper:.08});}const inner=OUT.join('');OUT=save;OUT.push(`<g clip-path="url(#${id})">${inner}</g>`);}
function ell(cx,cy,rx,ry,a0=0,a1=6.2832,n){n=n||Math.max(10,Math.round((rx+ry)/2.2));const o=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;o.push([cx+Math.cos(a)*rx,cy+Math.sin(a)*ry]);}return o;}
const rect=(x,y,w,h)=>[[x,y],[x+w,y],[x+w,y+h],[x,y+h],[x,y]];
function rot(pts,cx,cy,deg){const a=deg*Math.PI/180,c=Math.cos(a),s=Math.sin(a);return pts.map(p=>[cx+(p[0]-cx)*c-(p[1]-cy)*s,cy+(p[0]-cx)*s+(p[1]-cy)*c]);}
function txt(x,y,s,size,o={}){OUT.push(`<text x="${x}" y="${y}" font-family="${o.ff||'Bad Script'}" font-size="${size}" fill="${C(o.col||'ink')}" text-anchor="${o.anchor||'middle'}"${o.rot?` transform="rotate(${o.rot} ${x} ${y})"`:''}${o.it?' font-style="italic"':''}${o.op!=null?` opacity="${o.op}"`:''}${o.ls?` letter-spacing="${o.ls}"`:''}>${s}</text>`);}
function dot(x,y,r,col='ink',op){OUT.push(`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${C(col)}"${op!=null?` opacity="${op}"`:''}/>`);}
function hit(x,y,w,h,act){HITS.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="transparent" data-act="${act}" style="cursor:pointer"/>`);}
function limb(pts,w0,w1,col='paper',lw=1.2){const n=pts.length,L=[],Rr=[];for(let i=0;i<n;i++){const p=pts[i],a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)];let nx=-(b[1]-a[1]),ny=b[0]-a[0];const l=Math.hypot(nx,ny)||1;nx/=l;ny/=l;const w=(w0+(w1-w0)*i/(n-1))/2;L.push([p[0]+nx*w,p[1]+ny*w]);Rr.push([p[0]-nx*w,p[1]-ny*w]);}const e=pts[n-1],d=pts[n-2],th=Math.atan2(e[1]-d[1],e[0]-d[0]),cap=[];for(let k=1;k<6;k++){const an=th+Math.PI/2-Math.PI*k/6;cap.push([e[0]+Math.cos(an)*w1/2,e[1]+Math.sin(an)*w1/2]);}const poly=[...L,...cap,...Rr.reverse()];fillp(poly,col);closed(poly,lw,'ink',{over:.02});return poly;}
function heartPts(cx,cy,s){const o=[];for(let i=0;i<=40;i++){const t=i/40*6.2832;o.push([cx+s*16*Math.pow(Math.sin(t),3),cy-s*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))]);}return o;}
function cap(fn){const so=OUT,sd=DEFS;OUT=[];DEFS=[];fn();const s=(DEFS.length?`<defs>${DEFS.join('')}</defs>`:'')+OUT.join('');OUT=so;DEFS=sd;return s;}
function grp(attr,fn){OUT.push(`<g ${attr}>`);fn();OUT.push('</g>');}
/* ---------- clock ---------- */
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const realHour=()=>{const d=new Date();return d.getHours()+d.getMinutes()/60;};
let HOUR=Q.has('h')?+Q.get('h'):realHour(), manual=Q.has('h');
const hhmm=h=>{const H=Math.floor(h)%24,M=Math.round((h-Math.floor(h))*60)%60;return H+':'+String(M).padStart(2,'0');};
const today=()=>{const d=new Date();return d.getDate()+' '+MON[d.getMonth()];};
/* ---------- paper ---------- */
function paperBg(){OUT.push(`<rect width="390" height="844" fill="${P.paper}"/>`);
 seed(3);for(let i=0;i<26;i++){const x=R()*390,y=R()*844,a=R()*6.28,l=10+R()*30;ln([[x,y],[x+Math.cos(a)*l,y+Math.sin(a)*l*.4]],.45,'ink',{op:P.dark?.08:.06,amp:1.5});}}
function grease(spots){seed(77);for(const[x,y,r]of spots){const pts=ell(x,y,r,r*(.7+R()*.4),0,6.2832,22).map(p=>[p[0]+j(r*.18),p[1]+j(r*.18)]);wash(pts,'B',P.dark?.12:.16,{amp:2});closed(pts,.5,'B',{op:.25});}}
/* ---------- headline: the hour, lettered ---------- */
function headline(big){
 if(big){txt(195,148,P.name,96,{});seed(9);ln([[118,170],[160,174],[230,168],[278,163]],2.4,'B',{amp:1.2});
  txt(195,204,`${P.place} · ${hhmm(HOUR)}`,15.5,{ff:'Literata',it:true,op:.85});}
 else{txt(34,104,P.name,40,{anchor:'start'});txt(36,128,hhmm(HOUR),12.5,{ff:'Literata',it:true,anchor:'start',op:.75});}}
function verb(word,x,y,act,o={}){seed(word.length*13+7);txt(x,y,word,o.size||38,{});const w=(o.size||38)*word.length*.23+14;
 const pts=ell(x,y-11,w,27,-.4,6.0,40).map((p,i)=>[p[0]+j(1.4),p[1]+j(1.4)]);ln(pts,1.7,'B',{amp:1.6,raw:false,taper:.2});
 hit(x-w-8,y-46,2*w+16,64,act);}
function notebookIcon(){seed(61);const x=318,y=748;const pg=[[x,y],[x+40,y-4],[x+42,y+42],[x+2,y+46]];fillp(pg,'paper');wash(pg,'A',.35);closed(pg,1.4);
 ln([[x+7,y+1],[x+9,y+44]],1);for(let k=0;k<4;k++)ln([[x+13,y+12+k*8],[x+35,y+10+k*8]],.6,'ink',{op:.6});
 fillp([[x+28,y-3],[x+34,y-4],[x+35,y+58],[x+31.5,y+53],[x+28,y+58]],'B');closed([[x+28,y-3],[x+34,y-4],[x+35,y+58],[x+31.5,y+53],[x+28,y+58]],.8);
 hit(x-8,y-10,62,70,'book');}
/* ---------- places ---------- */
const G=652;
function ground(){seed(21);ln([[-5,G],[120,G+1],[260,G-1],[395,G+1]],1.6);
 for(let i=0;i<9;i++){const x=R()*390,y=G+14+R()*120;ln([[x,y],[x+20+R()*40,y+j(2)]],.7,'ink',{op:.45});}}
function placeMorning(){seed(11);
 wash([[-10,236],[120,230],[260,238],[400,226],[400,400],[300,392],[160,404],[-10,396]],'A',.3,{amp:7});
 for(let i=0;i<14;i++){const y=410+i*4+j(1),x=R()*300;ln([[x,y],[x+30+R()*60,y]],.6,'A',{op:.8});}
 // sun low in the east, thin ochre
 wash(ell(318,282,22,22),'B',.75);closed(ell(318,282,22,22),1);
 // school building: long, low, gabled
 const b=[[178,430],[400,430],[400,510],[178,510]];fillp(b);closed(b,1.3);
 const roof=[[166,432],[262,380],[288,384],[398,384],[400,432]];fillp(roof);wash(roof,'A',.85);hatch(roof,-62,4.2,.6,'ink',{op:.7,trim:.15});closed(roof,1.5);
 ln([[262,380],[256,370],[264,374]],1.2);
 for(let i=0;i<5;i++){const wx=196+i*40;const w=rect(wx,446,24,30);closed(w,1);hatch(w,90,3.4,.55,'ink',{op:.6});}
 txt(230,424,'โรงเรียน',10,{ff:'Mali',op:.8});
 // fence and gate
 for(let x=-4;x<400;x+=13){ln([[x,516],[x+j(1),604]],1);}
 ln([[-5,528],[395,526]],1.3);ln([[-5,592],[395,590]],1.3);
 for(const gx of[14,330]){const p=rect(gx,460,16,150);fillp(p);closed(p,1.5);hatch(p,90,3,.6,'ink',{op:.7});dot(gx+8,456,7,'ink');}
 // frangipani tree, left
 ln([[44,610],[46,520],[38,470],[22,430]],3.2);ln([[46,522],[70,470],[92,440]],2.4);ln([[40,478],[60,452]],1.6);ln([[70,472],[56,436]],1.6);
 seed(14);for(const[cx,cy]of[[22,420],[92,430],[56,428],[62,446],[100,446],[30,440]]){for(let k=0;k<4;k++){const lx=cx+j(14),ly=cy+j(8),a=R()*6.3;const leaf=[[lx,ly],[lx+Math.cos(a)*16+3,ly+Math.sin(a)*7],[lx+Math.cos(a)*24,ly+Math.sin(a)*10],[lx+Math.cos(a)*15-2,ly+Math.sin(a)*12],[lx,ly]];wash(leaf,'A',.8);closed(leaf,.8);}
  for(let k=0;k<3;k++){const fx=cx+j(12),fy=cy+j(8);for(let q=0;q<5;q++){const a=q*1.256+R()*.3;ln([[fx,fy],[fx+Math.cos(a)*4.5,fy+Math.sin(a)*4.5]],2.3,'ink',{op:.9,amp:.2});}dot(fx,fy,1.6,'B');}}
 ground();}
function placeDay(){seed(12);
 // power pole and the tangle of lines — every Thai street
 ln([[34,G-40],[36,230]],3);ln([[16,250],[56,246]],1.6);ln([[20,268],[52,266]],1.2);
 for(let k=0;k<5;k++){const y0=246+k*5+j(2);const pts=[];for(let i=0;i<=24;i++){const t=i/24;pts.push([36+t*380,y0+Math.sin(t*Math.PI)*(22+k*6)+t*12]);}ln(pts,.8,'ink',{op:.8});}
 // shophouses
 for(let i=0;i<3;i++){const x=60+i*118;const fac=[[x,330],[x+112,330],[x+112,G-50],[x,G-50]];fillp(fac);closed(fac,1.3);
  for(let k=0;k<2;k++){const w=rect(x+16+k*48,350,32,40);closed(w,1);if((i+k)%2===0){wash(w,'A',.85);}hatch(w,0,4,.5,'ink',{op:.6});}
  ln([[x,404],[x+112,402]],1.3);const sh=rect(x+10,418,92,G-50-418);if(i===1)wash(sh,'A',.6);hatch(sh,0,4.5,.55,'ink',{op:.55});closed(sh,1);
  txt(x+56,326,['ร้านทอง','ร้านยา','ก๋วยเตี๋ยว'][i],10,{ff:'Mali',op:.7});}
 // noon: hard sun, short shadows — the sky is just paper
 hatch([[30,G-50],[400,G-50],[400,G],[10,G]],-8,5,.5,'A',{op:.9,trim:.2,skip:.2});
 ground();}
function placeEvening(){seed(13);
 wash([[-10,232],[400,240],[400,410],[-10,404]],'A',.34,{amp:7});
 wash([[-10,372],[400,384],[400,472],[-10,474]],'B',.42,{amp:5});
 // sun on the water line
 wash(ell(52,472,28,28,3.14,6.29),'B',.95);ln(ell(52,472,28,28,3.1,6.33),1.1);
 // far bank: stilt houses
 for(let i=0;i<4;i++){const x=150+i*62,w=50,top=398+j(6);const h=[[x,top],[x+w,top],[x+w,top+34],[x,top+34]];fillp(h);wash(h,'A',.7);closed(h,1.1);
  const r=[[x-6,top+2],[x+w/2,top-20],[x+w+6,top+2]];ln(r,1.3);hatch([[x-4,top+1],[x+w/2,top-18],[x+w+4,top+1]],-40,3.4,.5,'ink',{op:.7});
  for(let k=0;k<4;k++)ln([[x+4+k*14,top+34],[x+4+k*14+j(1),474]],.9);}
 ln([[-5,474],[400,472]],1.2);

<filter id="mottle" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".008 .012" numOctaves="3" seed="11"/>
<feColorMatrix type="matrix" values="0 0 0 0 VAL 0 0 0 0 VAL 0 0 0 0 VAL 0 0 0 -1.4 .9"/></filter></defs>`;
let S=+(Q.get('s')||1);if(!(S>=1&&S<=6))S=1;card=+(Q.get('card')||0);
function render(){const ph=phaseOf(HOUR);P=PAL[ph];BL=P.dark?'screen':'multiply';cid=0;CP='c';HITS=[];
 document.getElementById('phone').style.background=P.paper;document.body.style.background=P.dark?'#2a2c33':'#cfc9be';
 if(S===3&&!dough)initDough();
 const body=cap(()=>{paperBg();({1:s1,2:s2,3:s3,4:s4,5:s5,6:s6})[S]();});
 const gv=P.dark?'.95':'.25';
 svg.innerHTML=FILTERS.replace(/VAL/g,gv)+`<g id="art" filter="url(#boil)">${body}</g>`+
  `<rect width="390" height="844" filter="url(#grain)" opacity="${P.dark?.10:.22}" pointer-events="none"/>`+
  `<rect width="390" height="844" filter="url(#mottle)" opacity="${P.dark?.06:.12}" pointer-events="none"/>`+HITS.join('');
 dyn();hearts();panel();}
function dyn(){const d=document.getElementById('dyn');if(!d)return;CP='d';cid=0;d.innerHTML=cap(()=>{if(S===3)drawDough();if(S===4)drawTava();});CP='c';}
/* ---------- reviewer panel ---------- */
const CAPS={1:g=>`Игрок приходит к тележке: место, свет и два цвета — по часам телефона (${P.name}, ${P.place}). Никого ещё нет. Тап по тележке или «открыть» внизу.`,
 2:g=>`Подходит ${P.guest}, заказ — рисунком в облачке. Тётя Сом на табурете показывает ладонью «прижми», без слов. Тап по облачку или «к тесту».`,
 3:g=>`Тесто на столе во весь большой палец: тяни от края — лист растёт и светлеет; пунктир — это пальцы Сом. Тащи середину листа на таву в углу или «на таву».`,
 4:g=>`На таве роти золотится, пятна темнеют, идёт пар; две клетки внизу — стороны. Готово — тап по роти: переворот, потом «на стол».`,
 5:g=>card?`Роти стало открыткой: время, место, штемпель. «Отпустить» — открытка уходит в мир.`:`Роти нарезано и полито сгущёнкой, гость доволен. «Показать миру» превращает его в открытку.`,
 6:g=>`Сердечки опускаются тихо и без счёта; ниже — тетрадь (это и есть меню): сегодня и прошлые дни. «К тележке» — назад.`};
function panel(){document.getElementById('stn').textContent=`· ${S}/6`;document.getElementById('cap').textContent=CAPS[S]();
 document.getElementById('hl').textContent=`${hhmm(HOUR)} · ${P.name}`;document.getElementById('hr').value=HOUR;}
function go(n){S=n;card=0;done=0;side=1;flipT=0;if(n===3)initDough();if(n===4&&SHOT)done=+(Q.get('d')||.7);render();}
function act(a){({open:()=>go(2),order:()=>go(3),tava:()=>go(4),flip:tapRoti,share:()=>{card=1;render();},release:()=>go(6),book:()=>go(6),cart:()=>go(1)})[a]?.();}
function tapRoti(){if(done<.62||flipT)return;if(side===1){const t0=performance.now();const step=()=>{flipT=Math.min(1,(performance.now()-t0)/520);if(flipT>=.5&&side===1){side=2;side1=done;done=0;}dyn();if(flipT<1)requestAnimationFrame(step);else{flipT=0;dyn();}};requestAnimationFrame(step);}else go(5);}
document.getElementById('prev').onclick=()=>go(S===1?6:S-1);document.getElementById('next').onclick=()=>go(S===6?1:S+1);
document.getElementById('now').onclick=()=>{HOUR=realHour();manual=false;render();};
document.getElementById('hr').oninput=e=>{HOUR=+e.target.value;manual=true;render();};
document.getElementById('hide').onclick=()=>document.body.classList.add('hide');document.getElementById('chip').onclick=()=>document.body.classList.remove('hide');
/* ---------- touch ---------- */
function svgPt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());return[q.x,q.y];}
function inPoly(p,poly){let c=false;for(let i=0,k=poly.length-1;i<poly.length;k=i++){const a=poly[i],b=poly[k];if((a[1]>p[1])!==(b[1]>p[1])&&p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0])c=!c;}return c;}
let drag=null;
svg.addEventListener('pointerdown',e=>{const p=svgPt(e);
 if(S===3&&dough){const cx=dough.reduce((s,q)=>s+q[0],0)/dough.length,cy=dough.reduce((s,q)=>s+q[1],0)/dough.length;
  let near=Infinity;for(const q of dough)near=Math.min(near,Math.hypot(q[0]-p[0],q[1]-p[1]));
  if(inPoly(p,dough)||near<26){const mode=Math.hypot(p[0]-cx,p[1]-cy)<38?'carry':'pull';drag={mode,last:p,start:p};svg.setPointerCapture(e.pointerId);return;}}
 const a=e.target.closest&&e.target.closest('[data-act]');if(a)act(a.dataset.act);});
svg.addEventListener('pointermove',e=>{if(!drag)return;const p=svgPt(e),dx=p[0]-drag.last[0],dy=p[1]-drag.last[1];
 if(drag.mode==='carry')dough=dough.map(q=>[q[0]+dx,q[1]+dy]);
 else{const s=drag.start;dough=dough.map(q=>{const w=Math.exp(-((q[0]-s[0])**2+(q[1]-s[1])**2)/(2*48*48));return[q[0]+dx*w*.9,q[1]+dy*w*.9];});drag.start=[s[0]+dx*.9,s[1]+dy*.9];}
 drag.last=p;dyn();});
svg.addEventListener('pointerup',e=>{if(!drag)return;const p=svgPt(e);const m=drag.mode;drag=null;if(m==='carry'&&Math.hypot(p[0]-372,p[1]-828)<150)go(4);});
/* ---------- clocks ---------- */
setInterval(()=>{if(S===4&&!SHOT&&!flipT&&done<1){done=Math.min(1,done+.02);dyn();}},140);
setInterval(()=>{if(!manual){const h=realHour();if(phaseOf(h)!==phaseOf(HOUR)||Math.floor(h*60)!==Math.floor(HOUR*60)){HOUR=h;render();}}},30000);
let bs=1;setInterval(()=>{const t=document.getElementById('boilT');if(t&&!SHOT){bs=bs%3+1;t.setAttribute('seed',bs);}},260);
function fit(){const ph=document.getElementById('phone');if(innerWidth>520){const s=Math.min(1,(innerHeight-40)/844);ph.style.transform=SHOT?'':`scale(${s})`;}else ph.style.transform='';}
addEventListener('resize',fit);fit();
if(S===4&&SHOT)done=+(Q.get('d')||.7);if(Q.has('side')){side=2;side1=.8;}
(document.fonts?document.fonts.ready:Promise.resolve()).then(render);render();
</script>
