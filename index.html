<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Roti Stand</title>
<style>
  /* Palette taken from the stand itself (prototype/dough-closeup) so the short link
     does not look like a stranger's page standing in front of the game. */
  :root{ --bg:#14100c; --ink:#e8ddcc; --dim:#8b7f6e; --line:#2a231b; --hot:#d98b3a; }
  *{ box-sizing:border-box }
  html{ background:var(--bg) }
  body{ margin:0; color:var(--ink);
    font:16px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    -webkit-text-size-adjust:100%;
    /* dvh, а не vh: на телефоне панели браузера съезжают, и vh даёт скачок */
    min-height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:max(24px,env(safe-area-inset-top)) 20px max(24px,env(safe-area-inset-bottom)); }
  @supports not (height:100dvh){ body{ min-height:100vh } }
  main{ width:100%; max-width:34rem }
  h1{ font-size:clamp(22px,5.4vw,30px); letter-spacing:.06em; margin:0 0 .2em; font-weight:600 }
  .sub{ color:var(--dim); margin:0 0 2rem; font-size:clamp(13px,3.2vw,15px) }
  a.card{ display:block; text-decoration:none; color:inherit;
    border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:12px;
    background:#1c1710; transition:border-color .15s ease, background .15s ease }
  a.card:hover, a.card:focus-visible{ border-color:var(--hot); background:#221a12 }
  a.card:focus-visible{ outline:2px solid var(--hot); outline-offset:2px }
  .card b{ color:var(--hot); font-weight:600; display:block; margin-bottom:.25em;
    font-size:clamp(15px,3.6vw,17px) }
  .card span{ color:var(--dim); font-size:clamp(12.5px,3vw,14px); display:block }
  footer{ margin-top:1.6rem; color:var(--dim); font-size:12.5px; line-height:1.7 }
  footer a{ color:var(--dim) }
  /* Телефон в ландшафте: высоты 390 px, и страница переставала помещаться целиком.
     Сжимаем отступы, а не шрифт — читаемость важнее пары спасённых пикселей. */
  @media (max-height:460px){
    .sub{ margin-bottom:1rem }
    a.card{ padding:11px 14px; margin-bottom:8px }
    footer{ margin-top:1rem }
  }
  @media (prefers-reduced-motion:reduce){ a.card{ transition:none } }
</style>

<main>
  <h1>Roti Stand</h1>
  <p class="sub">Вечерняя тайская макашница: тесто, тава, роти.</p>

  <a class="card" href="prototype/dough-closeup/">
    <b>Стенд теста &rarr;</b>
    <span>Прижать, растянуть шлепком, перекинуть на таву круговым махом.
      Пальцем на телефоне — так и задумано.</span>
  </a>

  <a class="card" href="docs/overview.html">
    <b>Обзор проекта &rarr;</b>
    <span>Концепт, принятые решения, разбор ревью, план.</span>
  </a>

  <footer>
    Исходники: <a href="https://github.com/newYurk/roti-stand">github.com/newYurk/roti-stand</a>
  </footer>
</main>
