<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<!-- Стенд правится часто, а GitHub Pages отдаёт max-age=600: без этого телефон
     показывает вчерашнюю сборку и правки «не доезжают». -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Макашница</title>
<!-- С домашнего экрана: без полосы Safari, портрет, цвета тележки (шаг 1 v0). -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Макашница">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#14100c">
<!-- Режим стенда (?dev=1) включается до первой раскладки, чтобы поле не прыгало. -->
<script>if(/[?&]dev=1(&|$)/.test(location.search)) document.documentElement.classList.add("dev");</script>
<link rel="stylesheet" href="stand.css?v=2026-11-17-b75b">

</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="topbar"><div id="hint">прижимай кусок: где ведёшь — там тоньше, край остаётся толстым. Когда весь тонкий — можно тянуть край</div>
  <div id="live">прижми кусочек теста</div></div>
  <div id="flash"></div>
  <div id="previewBadge" hidden></div>
  <div id="card" hidden>
    <div id="cardBody"></div>
    <button id="nextRoti">следующий роти</button>
  </div>
  <!-- Радио: служебный листок рамки вечера, единственное место со словами (evening.js). -->
  <div id="radioSheet" hidden>
    <div id="radioBox">
      <button id="sound">звук: выкл</button>
      <button id="evRestart">начать вечер заново</button>
      <button id="evPanel">панель стенда</button>
      <button id="evLog">скопировать журнал</button>
      <div id="evBuild"></div>
      <button id="evClose">закрыть</button>
    </div>
  </div>
</div>

<div id="panel">
  <div id="core">
    <div class="grp" id="gStep"><b>шаг</b>
      <button data-s="1" class="on">расплющить</button>
      <button data-s="2">растянуть</button>
      <button data-s="3">на таву</button>
      <button id="foldSample" title="Начать отдельную пробу складок на новом растянутом листе">проба конверта</button>
    </div>
    <div class="grp" id="gDish" hidden><b>конверт</b>
      <button id="bananaMode" title="Класть ломтики банана на открытый лист">банан</button>
      <button id="eggMode" title="Лить яйцо на открытый лист">яйцо</button>
      <button id="flipDish" disabled title="Технический вход: перевернуть лист на таве">перевернуть</button>
      <button id="cutMode" disabled>к нарезке →</button>
      <button id="serveDish" hidden>подать</button>
      <button id="undoDish" disabled>отменить</button>
    </div>
    <div class="grp measure" id="gFrame"><b>экран</b>
      <button data-frame="riverside">у реки</button>
      <button data-frame="canal">у канала</button>
      <button data-frame="" class="on">без рамы</button>
    </div>
    <div class="grp" id="gStretch"><b>дыры от шлепка</b>
      <button data-tear="easy">легко</button>
      <button data-tear="mid" class="on">как руки</button>
      <button data-tear="hard">крепко</button>
    </div>
    <div class="grp" id="gPlay">
      <button id="reset">заново</button>
      <button id="dump">скопировать лог</button>
      <button id="radioBtn" title="Звук, вечер заново, спрятать панель">радио</button>
    </div>
    <div class="grp measure" id="gZ"><b>высота</b>
      <button data-z="1.5">×1,5</button>
      <button data-z="2" class="on">×2</button>
      <button data-z="3">×3</button>
      <button data-z="5">×5</button>
    </div>
    <div class="grp measure" id="gView"><b>вид</b>
      <button data-v="A">A · 80</button>
      <button data-v="B">B · 224</button>
      <button data-v="C" class="on">C · контроль</button>
    </div>
    <button id="toolsBtn">прибор ▸</button>
    <div id="mini"></div>
  </div>
  <div id="tools">
    <div class="grp tune" id="gTune"><b>ощущение</b>
      <label>податливость<input id="sCom" type="range" min="0" max="100" value="100"></label>
      <label>текучесть<input id="sCreep" type="range" min="0" max="100" value="100"></label>
      <label>прочность<input id="sBreak" type="range" min="0" max="100" value="100"></label>
      <button id="tuneDefault" title="Вернуть стартовые 100 / 100 / 100, сохранив текущий лист">исходные</button>
    </div>
    <div class="grp measure" id="gCond"><b>судишь по</b>
      <button data-c="both" class="on">обоим</button>
      <button data-c="sight">картинке</button>
    </div>
    <div class="grp measure" id="gFry"><b>жарка, роти</b>
      <button data-f="40">40 с</button>
      <button data-f="60">60 с</button>
      <button data-f="180" class="on">3 мин</button>
    </div>
    <div class="grp measure" id="gPress"><b>прижим</b>
      <button data-p="0.35">0,35</button>
      <button data-p="1" class="on">1</button>
    </div>
    <div class="grp measure" id="gThrough"><b>низ сквозь лист</b>
      <button data-k="0">0</button>
      <button data-k="0.3" class="on">0,3</button>
      <button data-k="0.6">0,6</button>
    </div>
    <div class="grp" id="gSrv">
      <button id="hardReload">обновить</button>
    </div>
    <div id="stats"></div>
  </div>
</div>

<script src="stand.js?v=2026-11-17-b76"></script>
<script src="counter-item.js?v=2026-09-19"></script>
<script src="drizzle.js?v=2026-09-20-noserve"></script>
<script src="banana.js?v=2026-09-20f"></script>
<script src="egg.js?v=2026-09-20c"></script>
<script src="evening.js?v=2026-11-17-b76"></script>
<script src="guest.js?v=2026-11-17-b76"></script>
<script src="notebook.js?v=2026-11-17-b76"></script>
</body>
</html>
