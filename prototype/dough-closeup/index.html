<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Растяжка теста роти</title>
<style>
  html,body{margin:0;height:100%;background:#14100c;color:#e8ddcc;
    font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
  #boot{padding:24px;color:#8b7f6e}
</style>
</head>
<body>
<div id="boot">собираю стенд…</div>
<script>
(async () => {
  const PIN = "306ef13881702ceee9d4edbb69bb748f402dc5f0";
  const PATH = "prototype/dough-closeup/index.html";
  const urls = [
    "https://cdn.jsdelivr.net/gh/newYurk/roti-stand@" + PIN + "/" + PATH,
    "https://raw.githubusercontent.com/newYurk/roti-stand/" + PIN + "/" + PATH
  ];
  const boot = document.getElementById("boot");
  let html = null, err = null;
  for (const url of urls) {
    try {
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) throw new Error(url + " → " + r.status);
      html = await r.text();
      break;
    } catch (e) { err = e; }
  }
  if (!html) {
    boot.textContent = "не скачался стенд: " + (err && err.message);
    return;
  }
  // Лишняя «и» после tossTry давала ReferenceError и гасила canvas.
  html = html.replace("let tossOk = 0, tossTry = 0;и", "let tossOk = 0, tossTry = 0;");
  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
